# The chart on a local cluster, against deploy/local/backing.yaml. The settings follow the demo's
# (demo/k8s/demo-values.yaml): http storage, a test issuer, the console's token box on. Never use these values
# anywhere else.
replicaCount: 2

image:
  repository: nuna-catalog
  tag: local
  # run.sh builds the image with Podman and puts it on the kind cluster's node (kind_load): the node never pulls.
  pullPolicy: Never

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 768Mi

config:
  spring:
    datasource:
      url: jdbc:postgresql://postgres:5432/catalog
      username: catalog
  nuna:
    database:
      # backing.yaml's PostgreSQL is one node, so the self-check reports no synchronous standby, which would refuse
      # to start the server (D8.2).
      allow-unsafe: [pg.no-sync-standby]
    storage:
      require-tls: false
      profiles:
        silo:
          kind: MINIO
          # run.sh up sets silo.<namespace>.svc instead: clients in other namespaces (the maintenance worker and its
          # compaction Jobs) reach the store at the endpoint the catalog vends them.
          endpoint: http://silo:9000
          region: us-east-1
          table-root: s3://warehouse/tables
          allowed-prefixes: [s3://warehouse/tables]
          # The catalog's own Silo user (run.sh up), never Silo's root user, whom no policy binds: the delete policy
          # with except must bind the catalog and every credential it vends (D21).
          access-key-id: nuna-catalog
          # The maintenance worker's own Silo user (run.sh up), the only one its delete policy lets delete.
          maintenance-principal: nuna-maintenance
      catalogs:
        lakehouse:
          profile: silo
          kms-key-set: demo-keys
          legal-entity: Demo Entity
    security:
      issuers:
        - issuer: https://idp.demo/nuna
          jwks-uri: http://silo:9000/idp/keys.json
          audiences: [nuna-catalog]
          algorithms: [RS256]
          user-id-claim: sub
          groups-claim: groups
          client-id-claim: azp
        # The maintenance worker's identity provider (deploy/local/keycloak.yaml), which run.sh worker starts. Its
        # keys are fetched when its first token arrives, so the catalog runs without it.
        - issuer: http://keycloak:8080/realms/nuna
          jwks-uri: http://keycloak:8080/realms/nuna/protocol/openid-connect/certs
          audiences: [nuna-catalog]
          algorithms: [RS256]
          user-id-claim: preferred_username
          groups-claim: groups
          client-id-claim: azp
      grant-admin-groups: [demo-grant-admins]
      platform-operator-groups: [demo-operators]
      maintenance-principals: [service-account-nuna-maintenance]
    audit:
      kafka-bootstrap-servers: kafka:9092
    ui:
      dev-token-login: true

# secrets.values, the database's password (spring.datasource.password) and the catalog's Silo key
# (nuna.storage.profiles.silo.secret-access-key), are not here: run.sh makes them once per machine in
# ~/.nuna-k8s/secrets and passes each with helm's --set-file (backlog 282).
