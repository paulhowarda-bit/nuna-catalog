# Throwaway backing services for trying the chart on a local cluster: PostgreSQL, Kafka and Silo, as in the
# demo's stack (demo/k8s), plus a job that makes the warehouse bucket and publishes the test issuer's JWKS from
# the ConfigMap nuna-idp (deploy/local/run.sh makes it). No volumes: everything is lost with the pods. The passwords
# and keys are in Secret nuna-local-secrets, which run.sh makes from the ones it keeps per machine in
# ~/.nuna-k8s/secrets (backlog 282); none is in the repository. Test
# passwords and keys only; never use any of this outside a laptop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:18.7
          args: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
          env:
            - {name: POSTGRES_DB, value: catalog}
            - {name: POSTGRES_USER, value: catalog}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: nuna-local-secrets, key: postgres-password}}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "catalog", "-d", "catalog"]
            periodSeconds: 2
          resources:
            limits: {memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      # The image turns every KAFKA_* variable into a broker setting, and Kubernetes would add KAFKA_PORT and
      # friends for the Service named kafka.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.2.2
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx256m"}
          ports:
            - containerPort: 9092
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 2
          resources:
            limits: {memory: 640Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: {app: kafka}
  ports:
    - port: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo
spec:
  selector:
    matchLabels: {app: silo}
  template:
    metadata:
      labels: {app: silo}
    spec:
      containers:
        - name: silo
          image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
          args: ["server", "/data"]
          env:
            - {name: MINIO_ROOT_USER, value: nunademo}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: nuna-local-secrets, key: silo-root}}
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 2
          resources:
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: silo
spec:
  selector: {app: silo}
  ports:
    - port: 9000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
          env:
            - name: ROOT_SECRET_KEY
              valueFrom: {secretKeyRef: {name: nuna-local-secrets, key: silo-root}}
          command: ["sh", "-ec"]
          args:
            - |
              until mc alias set s http://silo:9000 nunademo "$ROOT_SECRET_KEY" >/dev/null; do sleep 2; done
              mc mb --ignore-existing s/warehouse s/idp
              mc anonymous set download s/idp
              mc cp /seed/keys.json s/idp/keys.json
          volumeMounts:
            - name: idp
              mountPath: /seed
      volumes:
        - name: idp
          configMap:
            name: nuna-idp
