{{- if .Values.serviceAccount.create }}
# The writer's identity in the cluster. It calls no Kubernetes API, and writes the store with the credentials the
# catalog vends it, so the account needs no rights.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nuna-audit-tables.serviceAccountName" . }}
  labels:
    {{- include "nuna-audit-tables.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
