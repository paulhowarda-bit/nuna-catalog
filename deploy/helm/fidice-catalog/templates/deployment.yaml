{{- $secret := include "fidice-catalog.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fidice-catalog.fullname" . }}
  labels:
    {{- include "fidice-catalog.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fidice-catalog.selectorLabels" . | nindent 6 }}
  # One new server at a time, and none taken away until its replacement is ready. A new release migrates the
  # schema while the previous one serves (M8's rolling-upgrade test).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "fidice-catalog.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # A change of settings restarts the servers.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fidice-catalog.serviceAccountName" . }}
      # The server never calls the Kubernetes API. IRSA's token is a separate projected volume, unaffected.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: catalog
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8181
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/etc/fidice/config/
            - name: SPRING_CONFIG_IMPORT
              value: optional:configtree:/etc/fidice/secrets/
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.javaToolOptions | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # The console's settings file: served without a token or a database read, so these probes say only
          # that the server is up and answering. A database outage is answered with 503 and Retry-After by
          # every server alike; taking them out of the Service would not help.
          startupProbe:
            httpGet:
              path: /ui/config.json
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /ui/config.json
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ui/config.json
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            # Give the Service time to stop sending requests here before Spring's graceful shutdown starts.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/fidice/config
              readOnly: true
            {{- if $secret }}
            - name: secrets
              mountPath: /etc/fidice/secrets
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "fidice-catalog.fullname" . }}
        {{- if $secret }}
        - name: secrets
          secret:
            secretName: {{ $secret }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{ toYaml (merge (deepCopy .) (dict "labelSelector" (dict "matchLabels" (include "fidice-catalog.selectorLabels" $ | fromYaml)))) | indent 10 | trim }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
