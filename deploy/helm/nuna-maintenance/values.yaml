# nuna-maintenance: the maintenance worker (D30). One release per catalog deployment, beside the nuna-catalog
# release; it reaches the catalog over HTTP like any client. See catalog-maintenance/README.md.

image:
  repository: nuna-maintenance
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The worker's settings, as Spring Boot properties in YAML form: rendered into application.yaml in a ConfigMap.
# Nothing secret goes here; secrets go in `secrets`. Every setting is documented on WorkerSettings in
# catalog-maintenance and in its README.
config:
  nuna:
    maintenance:
      # Required: the catalog as the worker reaches it.
      # catalog-uri: http://nuna-catalog:8181/
      scan-interval: PT10M
      # Required: the nightly cleanup window (D30, amended 2026-11-15), the only time compaction and orphan scans
      # start; each compaction Job stops at its end. start and end are local times in zone, a named zone; an end
      # before the start crosses midnight, and an end equal to the start keeps it open all day. The chart quotes
      # the times in the worker's application.yaml, where YAML 1.1 would read an unquoted 22:30 as the number 1350.
      cleanup-window: {}
      #   start: "22:30"
      #   end: "04:00"
      #   zone: Europe/London
      # The least time between two orphan scans of one table, in whole nights.
      orphan-interval: P1D
      # How the worker signs in: the client-credentials grant (endpoint, client-id, and client-secret in
      # `secrets`), or a token file another process keeps fresh (file). Its principal id must be listed in the
      # catalog's nuna.security.maintenance-principals, and its group needs write on every catalog it maintains.
      token:
        # endpoint: https://idp.example.internal/oauth2/token
        # client-id: nuna-maintenance
        audience: nuna-catalog
      # Its own storage identity, one per store, by a name of your choosing: the only identity the stores' delete
      # policy lets delete (D21, D30). Where on each store it lists and deletes is not set here: at every scan the
      # worker reads the prefixes of every catalog storage profile that names a maintenance-principal, and serves
      # a profile with the store whose kind and endpoint are the profile's (item 256; deploy/README.md, "Delete
      # rights"). A profile no store matches, or two do, is skipped and logged. Each store: kind (s3, minio or
      # ceph, as the catalog's profiles name it), endpoint (required, written exactly as the catalog's profiles
      # write it; the regional endpoint on AWS S3, e.g. https://s3.us-east-1.amazonaws.com), region,
      # access-key-id (secret-access-key in `secrets`); no keys means the AWS SDK's default chain, e.g. IRSA
      # through serviceAccount.annotations. For a store whose certificate a private CA signed, ca-bundle: a PEM
      # file of that CA, mounted from storageCaConfigMap, e.g. /etc/nuna/storage-ca/ceph.crt.
      # storage:
      #   ceph:
      #     kind: ceph
      #     endpoint: https://rgw.example.internal:7480
      #     region: us-east-1
      #     access-key-id: nuna-maintenance
      #     ca-bundle: /etc/nuna/storage-ca/ceph.crt
      storage: {}
      # The DR verifier (D37, amended 2026-11-20; docs/observability/dr-watermark.md), off unless a replica is
      # named. Every verify-interval it reads the catalog's DR work list, checks each table's and view's newer
      # versions in the DR store and reports each one's DR watermark: the newest version whose every file, data
      # included, the DR store holds. Run it in the primary region before a disaster, and in the DR region with its
      # replicas naming the DR store itself (deploy/README.md, "Recovering in the DR region").
      dr:
        verify-interval: PT1M
        # A replica per store, under the store's name in storage: the same buckets and paths, those the catalog's
        # prefixes give for that store, on the DR region's endpoint of the same kind. Each: endpoint (none for AWS
        # S3), region, access-key-id of keys that may only read those prefixes in the DR store (its
        # secret-access-key in `secrets`, as nuna.maintenance.dr.replicas.<store>.secret-access-key); no keys means
        # the AWS SDK's default chain. For a DR store whose certificate a private CA signed, ca-bundle: a PEM file
        # of that CA, mounted from storageCaConfigMap, e.g. /etc/nuna/storage-ca/ceph-dr.crt.
        # replicas:
        #   ceph:
        #     endpoint: https://ceph-dr.example.internal:7480
        #     region: us-east-1
        #     access-key-id: nuna-dr-reader
        #     ca-bundle: /etc/nuna/storage-ca/ceph-dr.crt
      # Compaction as Kubernetes Jobs (D30 (3), amended 2026-11-15): in the cleanup window, one Job per table that
      # needs it and night, the neediest first, max-jobs at once. Which tables need it is maintenance policy
      # (compaction.min-input-files, compaction.delete-file-ratio), set in the catalog. Off unless an image is
      # named: the repo's Spark image, catalog-tests-engines/images/spark. It needs the client-credentials grant
      # and token.scope (the Job signs in itself), and a namespace for the Jobs alone, created beforehand: never the
      # release's nor the catalog's. The chart grants the worker's service account get and create on Jobs and
      # create on Secrets there, and create on ConfigMaps when a store in storage names a ca-bundle (each Job's copy
      # of its store's CA), and makes job-service-account there, an account with no rights that the Jobs' pods run
      # as.
      compaction:
        image: ""
        image-pull-policy: IfNotPresent
        # namespace: nuna-compaction
        job-service-account: nuna-compaction
        # The catalog as the Job's pods reach it; by default catalog-uri.
        # catalog-uri: http://nuna-catalog:8181/
        memory: 2Gi
        driver-memory: 1g
        max-jobs: 2

# Secret settings, read as a Spring Boot config tree: each key of the Secret is a property name and its value
# the property's value, e.g. nuna.maintenance.token.client-secret,
# nuna.maintenance.storage.<store>.secret-access-key or nuna.maintenance.dr.replicas.<store>.secret-access-key.
secrets:
  # A Secret you manage in the release's namespace. Takes precedence over `values`.
  existingSecret: ""
  # Otherwise the chart makes a Secret from these. Keep them out of git: pass a private values file.
  values: {}

# A ConfigMap in the release's namespace holding the CA bundles of on-prem stores whose certificates a private CA
# signed, one PEM file per key, mounted at /etc/nuna/storage-ca. A store in storage or a DR replica names its file as
# ca-bundle; the worker's S3 clients to that endpoint trust it, beside the JVM's CAs. A compaction Job for a table on that
# store gets a copy, in a ConfigMap of its own in the Jobs' namespace, and its Spark trusts it beside the image's
# JDK CAs (backlog 88). The catalog's chart takes the same ConfigMap (docs/install-at-work.md).
storageCaConfigMap:
  name: ""

javaToolOptions: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"

env: []

# Metrics, traces and logs over OTLP/HTTP (docs/observability/README.md). Nothing is exported until an endpoint is
# named; stdout gets JSON log lines either way. The chart sets the standard OTEL_* variables, which Spring Boot reads.
telemetry:
  # The collector's OTLP/HTTP base URL, e.g. http://otel-collector.observability:4318 (OTEL_EXPORTER_OTLP_ENDPOINT);
  # /v1/metrics, /v1/traces and /v1/logs are added to it. OTLP over gRPC is not supported.
  endpoint: ""
  # Headers sent with every export, as name=value pairs separated by commas (OTEL_EXPORTER_OTLP_HEADERS), e.g. a
  # tenant id. Credentials go in headersSecret, which takes precedence.
  headers: ""
  # A Secret in the release's namespace that holds the headers, in the same form, under `key`.
  headersSecret:
    name: ""
    key: headers
  # A ConfigMap in the release's namespace that holds, under `key`, the PEM certificate of the CA that signed the
  # collector's, for an https endpoint (OTEL_EXPORTER_OTLP_CERTIFICATE).
  caConfigMap:
    name: ""
    key: ca.crt
  # The share of new traces recorded and exported, 0 to 1; a request whose caller's trace is sampled is always
  # recorded (parentbased_traceidratio).
  sampling: "0.1"
  # Resource attributes beside the ones the chart sets (service.name, service.namespace, service.version,
  # service.instance.id, k8s.namespace.name, k8s.pod.name, k8s.node.name), e.g. {deployment.environment.name: prod}.
  resourceAttributes: {}

# The orphan scan holds every file a table reaches in memory (D30 (8)); size the limit for the largest table.
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 2Gi

serviceAccount:
  create: true
  # Defaults to the release's full name.
  name: ""
  # The worker's own storage identity on AWS, e.g. eks.amazonaws.com/role-arn: the role the delete policy names.
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
