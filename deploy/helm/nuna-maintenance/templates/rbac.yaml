{{- if include "nuna-maintenance.compaction" . }}
{{- $jobs := dig "nuna" "maintenance" "compaction" "namespace" "" .Values.config -}}
{{- if not $jobs -}}
{{- fail "config.nuna.maintenance.compaction.namespace is required when compaction runs: a namespace for the Jobs alone, created beforehand" -}}
{{- end -}}
{{- if eq $jobs .Release.Namespace -}}
{{- fail "config.nuna.maintenance.compaction.namespace must not be the release's namespace: a pod may run as any service account and mount any Secret of its namespace, the worker's included" -}}
{{- end -}}
{{- $storageCa := false -}}
{{- range $name, $profile := dig "nuna" "maintenance" "storage" (dict) .Values.config -}}
{{- if get $profile "ca-bundle" }}{{ $storageCa = true }}{{ end -}}
{{- end }}
# Compaction (D30 (3)) runs in a namespace of its own, never the worker's nor the catalog's: a pod may run as any
# service account and mount any Secret of its namespace, so Jobs there could run as the worker. The worker creates
# one Job per table and night there and a Secret, owned by the Job, holding its sign-in for the Job's Spark; where a
# storage profile names a ca-bundle, also a ConfigMap, owned by the Job, holding that CA for the Job's Spark to trust
# (backlog 88), since a pod mounts only ConfigMaps of its own namespace. It reads a Job to see whether tonight's is
# there, and whether it finished or stopped at the window's end. Nothing else: it never lists, updates or deletes, and
# never reads a pod, a Secret or a ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nuna-maintenance.fullname" . }}-compaction
  namespace: {{ $jobs }}
  labels:
    {{- include "nuna-maintenance.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- if $storageCa }}
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nuna-maintenance.fullname" . }}-compaction
  namespace: {{ $jobs }}
  labels:
    {{- include "nuna-maintenance.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nuna-maintenance.fullname" . }}-compaction
subjects:
  - kind: ServiceAccount
    name: {{ include "nuna-maintenance.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# The account the Jobs' pods run as: no Role binds it and no token is mounted, so a Job can do nothing in the
# cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "config.nuna.maintenance.compaction.job-service-account is required when compaction runs" (dig "nuna" "maintenance" "compaction" "job-service-account" "" .Values.config) }}
  namespace: {{ $jobs }}
  labels:
    {{- include "nuna-maintenance.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
