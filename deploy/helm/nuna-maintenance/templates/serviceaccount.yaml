{{- if .Values.serviceAccount.create }}
# The worker's identity in the cluster: its storage identity on AWS (IRSA, through the annotations) and, when
# compaction runs, the account that creates the compaction Jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nuna-maintenance.serviceAccountName" . }}
  labels:
    {{- include "nuna-maintenance.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
