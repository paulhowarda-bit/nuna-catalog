{{- if include "keel-maintenance.compaction" . }}
{{- $jobs := dig "keel" "maintenance" "compaction" "namespace" "" .Values.config -}}
{{- if not $jobs -}}
{{- fail "config.keel.maintenance.compaction.namespace is required when compaction runs: a namespace for the Jobs alone, created beforehand" -}}
{{- end -}}
{{- if eq $jobs .Release.Namespace -}}
{{- fail "config.keel.maintenance.compaction.namespace must not be the release's namespace: a pod may run as any service account and mount any Secret of its namespace, the worker's included" -}}
{{- end }}
# Compaction (D30 (3)) runs in a namespace of its own, never the worker's nor the catalog's: a pod may run as any
# service account and mount any Secret of its namespace, so Jobs there could run as the worker. The worker creates
# one Job per table there and a Secret, owned by the Job, holding its sign-in for the Job's Spark; it reads a Job to
# see whether one is running or ran within the compaction interval. Nothing else: it never lists, updates or
# deletes, and never reads a pod or a Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "keel-maintenance.fullname" . }}-compaction
  namespace: {{ $jobs }}
  labels:
    {{- include "keel-maintenance.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "keel-maintenance.fullname" . }}-compaction
  namespace: {{ $jobs }}
  labels:
    {{- include "keel-maintenance.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "keel-maintenance.fullname" . }}-compaction
subjects:
  - kind: ServiceAccount
    name: {{ include "keel-maintenance.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# The account the Jobs' pods run as: no Role binds it and no token is mounted, so a Job can do nothing in the
# cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "config.keel.maintenance.compaction.job-service-account is required when compaction runs" (dig "keel" "maintenance" "compaction" "job-service-account" "" .Values.config) }}
  namespace: {{ $jobs }}
  labels:
    {{- include "keel-maintenance.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
