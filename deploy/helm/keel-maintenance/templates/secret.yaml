{{- if and (not .Values.secrets.existingSecret) .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keel-maintenance.fullname" . }}
  labels:
    {{- include "keel-maintenance.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $property, $value := .Values.secrets.values }}
  {{ $property }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
