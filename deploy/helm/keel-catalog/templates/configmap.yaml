{{- $_ := required "config.spring.datasource.url is required: the catalog's database" .Values.config.spring.datasource.url -}}
{{- if not .Values.config.keel.security.issuers -}}
{{- fail "config.keel.security.issuers needs at least one trusted token issuer" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keel-catalog.fullname" . }}
  labels:
    {{- include "keel-catalog.labels" . | nindent 4 }}
data:
  application.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
