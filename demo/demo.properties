# The catalog server in the demo network. Shape of catalog-tests-engines/compose/catalog/engines.properties.
# Local-only values: http storage, a test issuer, the token box switched on. Never use these in production.
keel.storage.require-tls=false
keel.storage.profiles.silo.kind=MINIO
keel.storage.profiles.silo.endpoint=http://silo:9000
keel.storage.profiles.silo.region=us-east-1
keel.storage.profiles.silo.table-root=s3://warehouse/tables
keel.storage.profiles.silo.allowed-prefixes=s3://warehouse/tables
keel.storage.profiles.silo.access-key-id=keeldemo
keel.storage.profiles.silo.secret-access-key=keeldemo-secret-key
keel.storage.catalogs.lakehouse.profile=silo
keel.storage.catalogs.lakehouse.kms-key-set=demo-keys
keel.storage.catalogs.lakehouse.legal-entity=Demo Entity

# The demo issuer (demo/Mint.java); its JWKS is a public-read Silo object.
keel.security.issuers[0].issuer=https://idp.demo/keel
keel.security.issuers[0].jwks-uri=http://silo:9000/idp/keys.json
keel.security.issuers[0].audiences=keel-catalog
keel.security.issuers[0].algorithms=RS256
keel.security.issuers[0].user-id-claim=sub
keel.security.issuers[0].groups-claim=groups
keel.security.issuers[0].client-id-claim=azp
keel.security.grant-admin-groups=demo-grant-admins
keel.security.platform-operator-groups=demo-operators

keel.audit.kafka-bootstrap-servers=kafka:9092

# The console's token box, for local use only (off by default).
keel.ui.dev-token-login=true
