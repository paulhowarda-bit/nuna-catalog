# The catalog server in the demo network. Shape of catalog-tests-engines/compose/catalog/engines.properties.
# Local-only values: http storage, a test issuer, the token box switched on. Never use these in production.
fidice.storage.require-tls=false
fidice.storage.profiles.silo.kind=MINIO
fidice.storage.profiles.silo.endpoint=http://silo:9000
fidice.storage.profiles.silo.region=us-east-1
fidice.storage.profiles.silo.table-root=s3://warehouse/tables
fidice.storage.profiles.silo.allowed-prefixes=s3://warehouse/tables
fidice.storage.profiles.silo.access-key-id=fidicedemo
fidice.storage.profiles.silo.secret-access-key=fidicedemo-secret-key
fidice.storage.catalogs.lakehouse.profile=silo
fidice.storage.catalogs.lakehouse.kms-key-set=demo-keys
fidice.storage.catalogs.lakehouse.legal-entity=Demo Entity

# The demo issuer (demo/Mint.java); its JWKS is a public-read Silo object.
fidice.security.issuers[0].issuer=https://idp.demo/fidice
fidice.security.issuers[0].jwks-uri=http://silo:9000/idp/keys.json
fidice.security.issuers[0].audiences=fidice-catalog
fidice.security.issuers[0].algorithms=RS256
fidice.security.issuers[0].user-id-claim=sub
fidice.security.issuers[0].groups-claim=groups
fidice.security.issuers[0].client-id-claim=azp
fidice.security.grant-admin-groups=demo-grant-admins
fidice.security.platform-operator-groups=demo-operators

fidice.audit.kafka-bootstrap-servers=kafka:9092

# The console's token box, for local use only (off by default).
fidice.ui.dev-token-login=true
