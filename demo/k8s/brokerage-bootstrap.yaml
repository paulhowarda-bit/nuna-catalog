# The brokerage world's bootstrap (D48, demo-datagen, image brokerage.Dockerfile): it makes the world's catalog
# namespaces, tables and views, as user brokerage (group demo-loaders), and its Kafka topics, then exits. demo.sh
# up runs it after the catalog and Kafka are up, waits for it and deletes it; then it sets the tables' governance,
# registers Kafka Connect's sink brokerage-lake and starts the generator (brokerage.yaml), whose environment this
# repeats. It makes the topics only while BROKERAGE_ROUTE includes Kafka. demo.sh runs the same Job, renamed, with
# args drain kafka or drain singlestore before it turns a way off (brokerage_job, backlog 238), and cdc as the CDC leg
# starts, which loads the clearing books into its CockroachDB (item 151), the back office into its PostgreSQL and the bank
# payments into its Oracle (item 152).
apiVersion: batch/v1
kind: Job
metadata:
  name: brokerage-bootstrap
spec:
  backoffLimit: 0
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: brokerage
          image: ${BROKERAGE_IMAGE}
          imagePullPolicy: Never
          args: ["bootstrap"]
          env:
            - {name: NUNA_CATALOG_URI, value: "http://nuna-catalog:8181"}
            - {name: NUNA_WAREHOUSE, value: lakehouse}
            - name: NUNA_TOKEN
              valueFrom:
                secretKeyRef: {name: demo-brokerage-token, key: token}
            - {name: KAFKA_BOOTSTRAP, value: "kafka:9092"}
            - {name: SINGLESTORE_URL, value: "jdbc:mariadb://singlestore:3306/brokerage"}
            - {name: SINGLESTORE_USER, value: root}
            - name: SINGLESTORE_PASSWORD
              valueFrom: {secretKeyRef: {name: singlestore-root, key: password}}
            - {name: BROKERAGE_ROUTE, value: "${BROKERAGE_ROUTE}"}
            # The world's scale, fixed when it begins (demo.sh: NUNA_DEMO_ACCOUNTS, NUNA_DEMO_SECURITIES,
            # NUNA_DEMO_CATCH_UP_DAYS; item 154).
            - {name: BROKERAGE_ACCOUNTS, value: "${BROKERAGE_ACCOUNTS}"}
            - {name: BROKERAGE_SECURITIES, value: "${BROKERAGE_SECURITIES}"}
            - {name: BROKERAGE_CATCH_UP_DAYS, value: "${BROKERAGE_CATCH_UP_DAYS}"}
            - {name: BROKERAGE_SEED, value: "20261122"}
            - {name: BROKERAGE_COMMIT_INTERVAL_MS, value: "15000"}
            # custody: the CDC leg's CockroachDB, as its login clearing (demo/cdc/cockroach.sql).
            - {name: COCKROACH_URL, value: "jdbc:postgresql://cockroach:26257/custody?sslmode=disable"}
            - {name: COCKROACH_USER, value: clearing}
            - name: COCKROACH_PASSWORD
              valueFrom: {secretKeyRef: {name: demo-secrets, key: clearing, optional: true}}
            # backoffice and treasury: the CDC leg's PostgreSQL, as its owner, and Oracle, as the schema's user (item 152;
            # demo/cdc/backoffice.sql, demo/cdc/oracle.sql).
            - {name: BACKOFFICE_URL, value: "jdbc:postgresql://backoffice:5432/backoffice"}
            - {name: BACKOFFICE_USER, value: backoffice}
            - name: BACKOFFICE_PASSWORD
              valueFrom: {secretKeyRef: {name: demo-secrets, key: backoffice, optional: true}}
            - {name: TREASURY_URL, value: "jdbc:oracle:thin:@//oracle:1521/FREEPDB1"}
            - {name: TREASURY_USER, value: treasury}
            - name: TREASURY_PASSWORD
              valueFrom: {secretKeyRef: {name: demo-secrets, key: treasury, optional: true}}
          securityContext: {allowPrivilegeEscalation: false}
          resources:
            # cdc replays the world, so its memory grows with the world's scale as the generator's (demo.sh
            # world_memory; item 154).
            limits: {memory: ${BROKERAGE_MEMORY_LIMIT}Mi}
