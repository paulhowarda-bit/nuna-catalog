# The brokerage world's bootstrap (D48, demo-datagen, image brokerage.Dockerfile): it makes the world's catalog
# namespaces, tables and views, as user brokerage (group demo-loaders), and its Kafka topics, then exits. demo.sh
# up runs it after the catalog and Kafka are up, waits for it and deletes it; then it sets the tables' governance,
# registers Kafka Connect's sink brokerage-lake and starts the generator (brokerage.yaml), whose environment this
# repeats. It makes the topics only while BROKERAGE_ROUTE includes Kafka. demo.sh runs the same Job, renamed, with
# args drain kafka or drain singlestore before it turns a way off (brokerage_job, backlog 238).
apiVersion: batch/v1
kind: Job
metadata:
  name: brokerage-bootstrap
spec:
  backoffLimit: 0
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: brokerage
          image: ${BROKERAGE_IMAGE}
          imagePullPolicy: Never
          args: ["bootstrap"]
          env:
            - {name: NUNA_CATALOG_URI, value: "http://nuna-catalog:8181"}
            - {name: NUNA_WAREHOUSE, value: lakehouse}
            - name: NUNA_TOKEN
              valueFrom:
                secretKeyRef: {name: demo-brokerage-token, key: token}
            - {name: KAFKA_BOOTSTRAP, value: "kafka:9092"}
            - {name: SINGLESTORE_URL, value: "jdbc:mariadb://singlestore:3306/brokerage"}
            - {name: SINGLESTORE_USER, value: root}
            - {name: SINGLESTORE_PASSWORD, value: "${SINGLESTORE_ROOT_PASSWORD}"}
            - {name: BROKERAGE_ROUTE, value: "${BROKERAGE_ROUTE}"}
            - {name: BROKERAGE_ACCOUNTS, value: "1000"}
            - {name: BROKERAGE_CATCH_UP_DAYS, value: "3"}
            - {name: BROKERAGE_SEED, value: "20261122"}
            - {name: BROKERAGE_COMMIT_INTERVAL_MS, value: "15000"}
          securityContext: {allowPrivilegeEscalation: false}
          resources:
            limits: {memory: 384Mi}
