# The stack the demo and the engine matrix share, part 1b: Kafka and kafbat, beside stack.yaml's PostgreSQL and
# key server. EngineMatrixTest applies both. demo/demo.sh applies this only while the brokerage world's generator
# or the CDC leg runs (demo.sh gen, demo.sh cdc; D50): the catalog audits to its log, not to Kafka (D23, amended
# 2026-11-23). No pod gets Service environment variables: the Kafka image reads every KAFKA_* variable as broker
# configuration. Kafka keeps its topics on a volume (claim kafka-data, below; backlog 237), so the generator and
# Kafka Connect's sink carry on from their offsets after demo.sh down and up, or gen stop and gen.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  # One broker at a time on the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.2.2
          imagePullPolicy: Never
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx256m"}
            # The volume holds the log, formatted for this cluster id: named, so a later start finds it its own.
            - {name: CLUSTER_ID, value: "5L6g3nShT-eMCtK--X86sw"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs}
          ports:
            - containerPort: 9092
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
          resources:
            limits: {memory: 640Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: kafka-data}
---
# Kafka's topics, Kafka Connect's offsets among them. demo.sh down, gen stop and cdc stop keep it; demo.sh wipe
# deletes it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: {app: kafka}
  ports:
    - port: 9092
---
# kafbat UI for the stack's Kafka: topics (the Kafka Connect source topic, the sink's control topic, the
# catalog's audit and change topics), their messages and consumer groups, and the demo's Kafka Connect
# connectors. The demo publishes it on
# port 8182 (ports.yaml); otherwise kubectl port-forward svc/kafka-ui 8080:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
spec:
  selector:
    matchLabels: {app: kafka-ui}
  template:
    metadata:
      labels: {app: kafka-ui}
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka-ui
          image: ${KAFKA_UI_IMAGE}
          imagePullPolicy: Never
          env:
            - {name: KAFKA_CLUSTERS_0_NAME, value: nuna}
            - {name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "kafka:9092"}
            # The demo's Kafka Connect (connect.yaml): its connectors, their tasks and configs. Unreachable when
            # the engine matrix runs on its own.
            - {name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME, value: connect}
            - {name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS, value: "http://connect:8083"}
            - {name: DYNAMIC_CONFIG_ENABLED, value: "false"}
            # Off: on by default, it asks api.github.com for kafbat's latest release every hour.
            - {name: GITHUB_RELEASE_INFO_ENABLED, value: "false"}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          # It uses about 350 MB. Reserving its whole limit, as a limit alone does, left no room in the demo
          # for CloudBeaver beside the CDC leg.
          resources:
            requests: {memory: 384Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  selector: {app: kafka-ui}
  ports:
    - port: 8080
