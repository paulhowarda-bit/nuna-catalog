# SingleStore, part 4 of the shared stack. Iceberg pipelines load tables from the catalog; in the demo, the
# change feed of its ops tables also commits to Iceberg through a connector pipeline. ${SINGLESTORE_IMAGE} is
# the dev image: demo.sh's has the change-feed connector built in, Studio's browser telemetry off and Studio
# signing people in through Keycloak with SAML (singlestore.Dockerfile), tagged with the hash of the jar and the
# Dockerfile so a change replaces the pod; a matrix run on its own uses the plain image, and has no Secret
# keycloak-keys, so the certificate's volume is optional. No volume for the data: it goes with the pod (demo.sh
# seeds a new one). The demo publishes Studio on port 8183. It reserves 1.5 GB though it uses over 2 GB:
# with Keycloak, a fuller reservation leaves no room on Docker Desktop's node for Spark's 2 GB job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: singlestore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: singlestore}
  template:
    metadata:
      labels: {app: singlestore}
      # SingleStore reads Keycloak's certificate only as it starts, so a new one replaces the pod.
      annotations: {keel-demo/keys: "${KEYCLOAK_KEYS_HASH}"}
    spec:
      enableServiceLinks: false
      containers:
        - name: singlestore
          image: ${SINGLESTORE_IMAGE}
          imagePullPolicy: Never
          env:
            - {name: ROOT_PASSWORD, value: keel-test}
            - {name: SINGLESTORE_SET_GLOBAL_ENABLE_OBSERVE_QUERIES, value: "1"}
            - {name: SINGLESTORE_SET_GLOBAL_ENABLE_ICEBERG_INGEST, value: "1"}
            # The dev image's license turns this on at every start: crash reports, DDL and table metadata to
            # phone-home.singlestore.com. The start script applies these variables after the license.
            - {name: SINGLESTORE_SET_GLOBAL_CRITICAL_DIAGNOSTICS, value: "OFF"}
          ports:
            - containerPort: 3306
            - containerPort: 8080
          # The image's own health check: its start script has finished (/server/.ready), and the master and leaf
          # answer. Port 3306 opens before the start script has set root's password, so a port check let
          # clients in too early (Access denied for user 'root').
          startupProbe:
            exec:
              command: ["/scripts/healthcheck.sh"]
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 120
          # The certificate SingleStore checks Studio's SAML sign-ins against: Keycloak's realm signing key's. And
          # the front door's certificate, which Studio serves HTTPS with (singlestore.Dockerfile).
          volumeMounts:
            - {name: keycloak-certificate, mountPath: /etc/keel-demo, readOnly: true}
            - {name: tls, mountPath: /etc/keel-demo/tls, readOnly: true}
          resources:
            requests: {memory: 1536Mi}
            limits: {memory: 3Gi}
      volumes:
        - name: keycloak-certificate
          secret:
            secretName: keycloak-keys
            optional: true
            items:
              - {key: realm-certificate-pem, path: keycloak-saml.crt}
        - name: tls
          secret: {secretName: demo-tls, optional: true}
---
apiVersion: v1
kind: Service
metadata:
  name: singlestore
spec:
  selector: {app: singlestore}
  ports:
    - name: sql
      port: 3306
    - name: studio
      port: 8080
