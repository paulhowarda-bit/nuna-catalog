# The maintenance worker (D30; chart deploy/helm/nuna-maintenance, release nuna-maintenance) in the demo's namespace,
# with its compaction Jobs in a namespace of their own, ${NAMESPACE}-compaction (maintenance-jobs.yaml). It keeps
# catalog lakehouse's tables, whose policy demo.sh turns on (demo/README.md, "Maintenance"): every scan it expires
# snapshots and rewrites manifests, and in the cleanup window, here open all day, it assesses each table once a night,
# queues the ones that need compaction and compacts them one at a time with the engine matrix's Spark image. It signs
# in to Keycloak with the client-credentials grant as client nuna-maintenance (keycloak-realm.json), whose service
# account is the catalog's maintenance principal (demo-values.yaml) in group demo-maintenance, which holds write on
# lakehouse (demo.sh grants); it deletes from Silo as a user of its own, nuna-maintenance (silo-maintenance.json).
# demo.sh fills in ${NAMESPACE} and passes the client secret, the Silo key and the image's id. Test settings only.
image:
  repository: nuna-maintenance
  tag: demo
  pullPolicy: Never

# The demo's node has about 94% of its memory asked for with ss and gen on (backlog 230), so the worker asks for
# little and may use up to 512 MiB; its heap is 60% of that. The demo's tables are small: the orphan scan's set of
# reachable files is a few thousand at most.
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi

javaToolOptions: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"

config:
  nuna:
    maintenance:
      # By the cluster's full names: the compaction Jobs reach the catalog and Keycloak from their own namespace.
      catalog-uri: http://nuna-catalog.${NAMESPACE}.svc:8181/
      scan-interval: PT5M
      # Open all day, each night ending as the next begins at noon in New York: whenever the demo comes up, the worker
      # assesses every table at once and starts compacting, so Overview and Maintenance fill within minutes; at noon
      # the next night assesses them again. The overnight run rebuilds the demo with a new database, which keeps no
      # nights from before.
      cleanup-window:
        start: "12:00"
        end: "12:00"
        zone: America/New_York
      token:
        endpoint: http://keycloak.${NAMESPACE}.svc:8080/realms/nuna/protocol/openid-connect/token
        client-id: nuna-maintenance
        # Iceberg's client asks for scope catalog unless told otherwise, which Keycloak refuses as unknown.
        scope: openid
      # Its own Silo user, which may list and delete beneath the tables and nothing else; demo.sh makes it on every up.
      # The prefixes come from the catalog's profile s3 (demo-values.yaml), which names this user as its
      # maintenance-principal; the worker serves it because the kind and endpoint here are the profile's.
      storage:
        s3:
          kind: minio
          endpoint: http://s3:9000
          access-key-id: nuna-maintenance
      # One Job at a time, asking the node for 64 MiB and using up to 1,280 MiB: beside the rest of the demo a Job
      # whose request were its limit would never schedule. Asking for little, it is also the first pod the node stops
      # if its memory runs short; a Job stopped part way keeps the file groups it committed.
      compaction:
        image: nuna-engines/spark:4.1.4-iceberg-1.12.0
        image-pull-policy: Never
        namespace: ${NAMESPACE}-compaction
        memory: 1280Mi
        memory-request: 64Mi
        driver-memory: 640m
        max-jobs: 1
