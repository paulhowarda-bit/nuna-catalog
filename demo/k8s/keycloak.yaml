# Keycloak: the demo's sign-in with a username and password, until a directory (AD, Entra ID) is configured.
# Realm nuna (keycloak-realm.json, which demo.sh loads as ConfigMap keycloak-realm) holds the demo's people,
# their groups and the clients of the console, kafbat, CloudBeaver and SingleStore Studio, and the audit table
# writer's client, which signs in with the client-credentials grant as its service account. The browser reaches
# Keycloak through the front door on https://<host>:8180 (ports.yaml, demo.sh's NUNA_DEMO_HOST), so its tokens
# carry issuer https://<host>:8180/realms/nuna, and it takes the front door's X-Forwarded headers; the catalog
# fetches the realm's keys inside the cluster, from http://keycloak:8080. Development mode, with an
# in-memory database: users and sessions go with the pod, and the realm is imported again when it starts.
# Only demo.sh applies this; a matrix run has none.
#
# The realm file names its secrets as ${NUNA_...} placeholders, which Keycloak fills from the environment as it
# imports: Secret keycloak-keys, which demo.sh makes once per machine (~/.nuna-demo/keycloak). Among them is the
# realm's signing key. A key generated at each start would change with every pod, and SingleStore checks Studio's
# SAML sign-ins against the key's certificate, which it reads only as it starts (singlestore.Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  # The old pod stops before the new one starts: its in-memory sessions would not carry over anyway, and
  # beside the CDC leg there is no room for two Keycloaks.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
      # The realm is imported when the pod starts, so a changed realm file or key replaces the pod.
      annotations: {nuna-demo/realm: "${KEYCLOAK_REALM_HASH}", nuna-demo/keys: "${KEYCLOAK_KEYS_HASH}"}
    spec:
      enableServiceLinks: false
      containers:
        - name: keycloak
          image: ${KEYCLOAK_IMAGE}
          imagePullPolicy: Never
          args: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true",
                 "--hostname=https://${DEMO_HOST}:8180", "--proxy-headers=xforwarded",
                 # Asked inside the cluster (http://keycloak:8080), the discovery document gives that address for
                 # the token and key endpoints, and the browser's for sign-in: Silo reads it (silo-signin.yaml).
                 "--hostname-backchannel-dynamic=true"]
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: nuna-test}
            - {name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25"}
            - name: NUNA_REALM_PRIVATE_KEY
              valueFrom: {secretKeyRef: {name: keycloak-keys, key: realm-private-key}}
            - name: NUNA_REALM_CERTIFICATE
              valueFrom: {secretKeyRef: {name: keycloak-keys, key: realm-certificate}}
            - name: NUNA_CLOUDBEAVER_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: keycloak-keys, key: cloudbeaver-client-secret}}
            - name: NUNA_AUDIT_TABLES_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: keycloak-keys, key: audit-tables-client-secret}}
            - name: NUNA_SILO_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: keycloak-keys, key: silo-client-secret}}
          ports:
            - containerPort: 8080
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 768Mi}
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: {app: keycloak}
  ports:
    - port: 8080
