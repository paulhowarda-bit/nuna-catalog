# Keycloak: the demo's sign-in with a username and password, until a directory (AD, Entra ID) is configured.
# Realm keel (keycloak-realm.json, which demo.sh loads as ConfigMap keycloak-realm) holds the demo's people,
# their groups and the console's client. The browser reaches Keycloak on localhost:8180 (ports.yaml), so its
# tokens carry issuer http://localhost:8180/realms/keel; the catalog fetches the realm's keys inside the
# cluster, from http://keycloak:8080. Development mode, with an in-memory database: users and sessions go with
# the pod, and the realm is imported again when it starts. Only demo.sh applies this; a matrix run has none.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
      # The realm is imported when the pod starts, so a changed realm file replaces the pod.
      annotations: {keel-demo/realm: "${KEYCLOAK_REALM_HASH}"}
    spec:
      enableServiceLinks: false
      containers:
        - name: keycloak
          image: ${KEYCLOAK_IMAGE}
          imagePullPolicy: Never
          args: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true",
                 "--hostname=http://localhost:8180"]
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: keel-test}
            - {name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25"}
          ports:
            - containerPort: 8080
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 768Mi}
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: {app: keycloak}
  ports:
    - port: 8080
