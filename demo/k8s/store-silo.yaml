# -Ps3=silo: Silo, the maintained MinIO fork, as Service s3 (http://s3:9000). Its console, MinIO's, is on the
# pod's 9001 (otherwise a random port at each start); the demo publishes it on port 8184 (ports.yaml). It keeps its
# objects, buckets, users and policies on a volume (claim s3-data, below; backlog 237). Its root user, nunatest,
# takes its secret key from Secret s3-root (key secret-key): demo.sh makes it from the key it keeps in
# ~/.nuna-demo/secrets (backlog 282), and the engine matrix from the one TestS3 makes for its JVM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  # One pod at a time on the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: s3}
  template:
    metadata:
      labels: {app: s3}
    spec:
      enableServiceLinks: false
      containers:
        - name: silo
          image: ${SILO_IMAGE}
          imagePullPolicy: Never
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - {name: MINIO_ROOT_USER, value: nunatest}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: s3-root, key: secret-key}}
          ports:
            - containerPort: 9000
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: s3-data}
---
# Silo's data: the warehouse's files. demo.sh down keeps it; demo.sh wipe deletes it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 20Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector: {app: s3}
  ports:
    - {name: s3, port: 9000}
    # The console, for the demo's front door (ports.yaml).
    - {name: console, port: 9001}
