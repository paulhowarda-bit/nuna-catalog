# One run of the lake writer (demo/LakeWriter.java, image lake.Dockerfile): another engine writing Iceberg
# through the catalog. demo.sh fills in the name and the command (seed or rate), waits for it and deletes it.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB}
spec:
  backoffLimit: 0
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      containers:
        - name: lake
          image: fidice-demo-lake:local
          imagePullPolicy: Never
          args: ["${MODE}"]
          env:
            - name: FIDICE_TOKEN
              valueFrom:
                secretKeyRef: {name: demo-lake-token, key: token}
          resources:
            limits: {memory: 768Mi}
