# The audit table writer (D23), the chart deploy/helm/nuna-audit-tables, release nuna-audit-tables: it writes the
# catalog's audit topic to nuna_audit.audit.events about a minute behind, and the console's Audit page reads that
# table back (demo-values.yaml declares the catalog and its groups). It signs in to Keycloak with the
# client-credentials grant as client nuna-audit-tables (keycloak-realm.json), whose service account is in group
# demo-audit-writers; demo.sh passes the client secret, made once per machine in ~/.nuna-demo/keycloak, and the
# image's id. Only demo.sh installs this; the engine matrix runs the writer with values of its own.
image:
  repository: nuna-audit-tables
  tag: demo
  pullPolicy: Never

config:
  nuna:
    audit-tables:
      catalog-uri: http://nuna-catalog:8181/
      # The service account's username, which the catalog names it by (preferred_username).
      principal: service-account-nuna-audit-tables
      token:
        # Inside the cluster; Keycloak names itself https://<host>:8180 in the token either way (keycloak.yaml).
        endpoint: http://keycloak:8080/realms/nuna/protocol/openid-connect/token
        client-id: nuna-audit-tables
        # Iceberg's client asks for scope catalog unless told otherwise, which Keycloak refuses as unknown.
        scope: openid
      # The catalog's audit log over OTLP (D23, amended 2026-11-23): the catalog sends its log nuna.audit to this
      # writer's receiver on 4318 (demo-values.yaml, telemetry), with the token demo.sh passes in `secrets`. The
      # demo runs Kafka only while gen or cdc is on (D50).
      source: otlp

# The demo's traffic is small: a minute's rows are a few thousand at most. 384 MB is what it asks of the node, so
# the engines' Spark job still fits beside it; the JVM may use up to 512 MB.
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
