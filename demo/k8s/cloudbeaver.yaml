# CloudBeaver Community (image cloudbeaver.Dockerfile, without its version check), a SQL UI in the browser,
# with one connection: Trino (trino.yaml) as ana, catalogs lakehouse and engines. Only demo.sh applies this;
# ports.yaml publishes it on localhost:8185.
#
# Open to anyone without signing in (anonymous access, and the connection granted to the anonymous team);
# the administrator, for CloudBeaver's own settings, is cbadmin / keel-test. CB_ADMIN_* configure the
# server at its first start, so no setup wizard shows. Everything lives in the pod, so a new pod starts
# from this file again. The Trino JDBC driver is in the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbeaver-config
data:
  initial-data-sources.conf: |
    {
      "folders": {},
      "connections": {
        "keel-trino": {
          "provider": "generic",
          "driver": "trino_jdbc",
          "name": "keel (Trino, as ana)",
          "save-password": true,
          "configuration": {
            "host": "trino",
            "port": "8080",
            "url": "jdbc:trino://trino:8080",
            "configurationType": "MANUAL",
            "type": "dev",
            "auth-model": "native",
            "user": "ana"
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
spec:
  replicas: 1
  selector:
    matchLabels: {app: cloudbeaver}
  template:
    metadata:
      labels: {app: cloudbeaver}
      # The connection is read only at the first start, so a changed file replaces the pod.
      annotations: {keel-demo/manifest: "${MANIFEST_HASH}"}
    spec:
      enableServiceLinks: false
      containers:
        - name: cloudbeaver
          image: ${CLOUDBEAVER_IMAGE}
          imagePullPolicy: Never
          env:
            - {name: CB_SERVER_NAME, value: keel demo}
            - {name: CB_ADMIN_NAME, value: cbadmin}
            - {name: CB_ADMIN_PASSWORD, value: keel-test}
            - {name: CLOUDBEAVER_POLICY_REQUIRE_MIXED_CASE, value: "false"}
            - {name: CLOUDBEAVER_POLICY_MIN_NUMBER_COUNT, value: "0"}
            - {name: CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED, value: "true"}
            - {name: CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM, value: "true"}
            - {name: JAVA_OPTS, value: "-Xmx384m"}
          volumeMounts:
            - name: config
              mountPath: /opt/cloudbeaver/conf/initial-data-sources.conf
              subPath: initial-data-sources.conf
          readinessProbe:
            httpGet: {path: /, port: 8978}
            periodSeconds: 5
          resources:
            requests: {memory: 384Mi}
            limits: {memory: 768Mi}
      volumes:
        - name: config
          configMap: {name: cloudbeaver-config}
