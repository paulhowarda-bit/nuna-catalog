# CloudBeaver Community (image cloudbeaver.Dockerfile, without its version check), a SQL UI in the browser.
# Only demo.sh applies this; ports.yaml publishes it on localhost:8185. Three connections:
#
#   keel-trino  Trino (trino.yaml) as ana, catalogs lakehouse and engines. Every query reaches keel as ana,
#               since Trino holds one token.
#   backoffice  the CDC leg's PostgreSQL (cdc.yaml), database backoffice
#   treasury    the CDC leg's Oracle (cdc.yaml), PDB FREEPDB1
#
# The two CDC sources answer only while the leg runs (demo.sh cdc), and Trino is stopped meanwhile. CloudBeaver
# reads them as reader / reader-demo, which may select their table and change nothing (demo/cdc/*.sql); changes
# go through demo.sh psql and demo.sh sqlplus. The drivers for all three are in the image.
#
# The demo's people sign in with their Keycloak passwords: oscar is CloudBeaver's administrator, and ana,
# gary and stella are users with the connections. CB_ADMIN_* configure the server at its first start, so no
# setup wizard shows; the postStart hook adds DEMO_USERS and grants them every connection
# (demo/CloudBeaverUsers.java), and the pod is not ready until it has. Everything lives in the pod, so a new pod
# starts from this file again.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbeaver-config
data:
  initial-data-sources.conf: |
    {
      "folders": {},
      "connections": {
        "keel-trino": {
          "provider": "generic",
          "driver": "trino_jdbc",
          "name": "keel (Trino, as ana)",
          "save-password": true,
          "configuration": {
            "host": "trino",
            "port": "8080",
            "url": "jdbc:trino://trino:8080",
            "configurationType": "MANUAL",
            "type": "dev",
            "auth-model": "native",
            "user": "ana"
          }
        },
        "backoffice": {
          "provider": "postgresql",
          "driver": "postgres-jdbc",
          "name": "backoffice (PostgreSQL, CDC source)",
          "save-password": true,
          "configuration": {
            "host": "backoffice",
            "port": "5432",
            "database": "backoffice",
            "url": "jdbc:postgresql://backoffice:5432/backoffice",
            "configurationType": "MANUAL",
            "type": "dev",
            "auth-model": "native",
            "user": "reader",
            "password": "reader-demo"
          }
        },
        "treasury": {
          "provider": "oracle",
          "driver": "oracle_thin",
          "name": "treasury (Oracle, CDC source)",
          "save-password": true,
          "configuration": {
            "host": "oracle",
            "port": "1521",
            "database": "FREEPDB1",
            "url": "jdbc:oracle:thin:@//oracle:1521/FREEPDB1",
            "configurationType": "URL",
            "type": "dev",
            "auth-model": "oracle_native",
            "user": "reader",
            "password": "reader-demo"
          }
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
spec:
  replicas: 1
  selector:
    matchLabels: {app: cloudbeaver}
  template:
    metadata:
      labels: {app: cloudbeaver}
      # The connection is read only at the first start, so a changed file replaces the pod.
      annotations: {keel-demo/manifest: "${MANIFEST_HASH}"}
    spec:
      enableServiceLinks: false
      containers:
        - name: cloudbeaver
          image: ${CLOUDBEAVER_IMAGE}
          imagePullPolicy: Never
          env:
            - {name: CB_SERVER_NAME, value: keel demo}
            - {name: CB_ADMIN_NAME, value: oscar}
            - {name: CB_ADMIN_PASSWORD, value: oscar-demo}
            - {name: DEMO_USERS, value: "ana:ana-demo gary:gary-demo stella:stella-demo"}
            # The demo's passwords have neither capitals nor digits.
            - {name: CLOUDBEAVER_POLICY_REQUIRE_MIXED_CASE, value: "false"}
            - {name: CLOUDBEAVER_POLICY_MIN_NUMBER_COUNT, value: "0"}
            - {name: CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED, value: "false"}
            - {name: JAVA_OPTS, value: "-Xmx384m"}
          lifecycle:
            postStart:
              exec:
                command: ["java", "-Xmx64m", "-cp", "/opt/keel-demo", "CloudBeaverUsers"]
          volumeMounts:
            - name: config
              mountPath: /opt/cloudbeaver/conf/initial-data-sources.conf
              subPath: initial-data-sources.conf
          readinessProbe:
            httpGet: {path: /, port: 8978}
            periodSeconds: 5
          resources:
            requests: {memory: 384Mi}
            limits: {memory: 768Mi}
      volumes:
        - name: config
          configMap: {name: cloudbeaver-config}
