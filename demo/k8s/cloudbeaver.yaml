# CloudBeaver Community (image cloudbeaver.Dockerfile, without its version check), a SQL UI in the browser.
# Only demo.sh applies this; ports.yaml publishes it on localhost:8185.
#
# The demo's people sign in with their Keycloak passwords: oscar is CloudBeaver's administrator, and ana,
# gary and stella are users. Each person has three connections of their own, which sign in as them:
#
#   keel (Trino, as <person>)             Trino (trino.yaml), catalogs lakehouse and engines. The connection
#                                         sends the person's catalog token, and Trino hands it to keel, so keel
#                                         sees the person.
#   backoffice (PostgreSQL, as <person>)  the CDC leg's PostgreSQL (cdc.yaml), database backoffice
#   treasury (Oracle, as <person>)        the CDC leg's Oracle (cdc.yaml), PDB FREEPDB1
#
# The two CDC sources answer only while the leg runs (demo.sh cdc), and Trino is stopped meanwhile. A person's
# accounts there have their Keycloak password (demo/cdc/*.sql). Each connection is granted to its person alone;
# oscar, as administrator, sees and may use everyone's. The drivers are in the image.
#
# CB_ADMIN_* configure the server at its first start, so no setup wizard shows; the postStart hook adds
# DEMO_USERS and everyone's connections (demo/CloudBeaverUsers.java), and the pod is not ready until it has.
# Everything lives in the pod, so a new pod starts from this file again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbeaver
spec:
  replicas: 1
  selector:
    matchLabels: {app: cloudbeaver}
  template:
    metadata:
      labels: {app: cloudbeaver}
      # The hook reads this file and the tokens (Secret demo-people-tokens) only as the pod starts, so a changed
      # file or new tokens replace the pod.
      annotations:
        keel-demo/manifest: "${MANIFEST_HASH}"
        keel-demo/tokens: "${TOKENS_HASH}"
    spec:
      enableServiceLinks: false
      containers:
        - name: cloudbeaver
          image: ${CLOUDBEAVER_IMAGE}
          imagePullPolicy: Never
          env:
            - {name: CB_SERVER_NAME, value: keel demo}
            - {name: CB_ADMIN_NAME, value: oscar}
            - {name: CB_ADMIN_PASSWORD, value: oscar-demo}
            - {name: DEMO_USERS, value: "ana:ana-demo gary:gary-demo stella:stella-demo"}
            # The demo's passwords have neither capitals nor digits.
            - {name: CLOUDBEAVER_POLICY_REQUIRE_MIXED_CASE, value: "false"}
            - {name: CLOUDBEAVER_POLICY_MIN_NUMBER_COUNT, value: "0"}
            - {name: CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED, value: "false"}
            - {name: JAVA_OPTS, value: "-Xmx384m"}
          lifecycle:
            postStart:
              exec:
                command: ["java", "-Xmx64m", "-cp", "/opt/keel-demo", "CloudBeaverUsers"]
          volumeMounts:
            - {name: tokens, mountPath: /opt/keel-demo/tokens, readOnly: true}
          readinessProbe:
            httpGet: {path: /, port: 8978}
            periodSeconds: 5
          resources:
            requests: {memory: 384Mi}
            limits: {memory: 768Mi}
      volumes:
        - name: tokens
          secret: {secretName: demo-people-tokens}
