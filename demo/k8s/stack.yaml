# The stack the demo and the engine matrix share, part 1: PostgreSQL, Kafka, kafbat and the token issuer's key
# server. Part 2 is the S3 store (store-silo.yaml or store-ceph.yaml, then seed.yaml), part 3 the catalog (the
# Helm chart with catalog-values.yaml), part 4 SingleStore (singlestore.yaml). demo/demo.sh and
# EngineMatrixTest both apply them. Images are never pulled by the cluster: Docker Desktop's runs them from the
# local Docker engine, and the harness loads them into kind. No pod gets Service environment variables: the
# Kafka image reads every KAFKA_* variable as broker configuration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18.7
          imagePullPolicy: Never
          args: ["-c", "shared_buffers=64MB", "-c", "max_connections=50"]
          env:
            - {name: POSTGRES_DB, value: catalog}
            - {name: POSTGRES_USER, value: catalog}
            - {name: POSTGRES_PASSWORD, value: catalog}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "catalog", "-d", "catalog"]
            periodSeconds: 2
          resources:
            limits: {memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.2.2
          imagePullPolicy: Never
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx256m"}
          ports:
            - containerPort: 9092
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 2
          resources:
            limits: {memory: 640Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: {app: kafka}
  ports:
    - port: 9092
---
# Serves the issuer's JWKS (ConfigMap idp-keys: demo/Mint.java's key for the demo, the harness's own for a
# matrix run on its own) so the catalog fetches its keys inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp
spec:
  selector:
    matchLabels: {app: idp}
  template:
    metadata:
      labels: {app: idp}
    spec:
      enableServiceLinks: false
      containers:
        - name: idp
          image: busybox:1.37.0
          imagePullPolicy: Never
          command: ["httpd", "-f", "-p", "8080", "-h", "/srv"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
          volumeMounts:
            - {name: keys, mountPath: /srv, readOnly: true}
      volumes:
        - name: keys
          configMap:
            name: idp-keys
---
apiVersion: v1
kind: Service
metadata:
  name: idp
spec:
  selector: {app: idp}
  ports:
    - port: 8080
---
# kafbat UI for the stack's Kafka: topics (the Kafka Connect source topic, the sink's control topic, the
# catalog's audit and change topics), their messages and consumer groups, and the CDC leg's Kafka Connect
# connectors. The demo publishes it on
# port 8182 (ports.yaml); otherwise kubectl port-forward svc/kafka-ui 8080:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
spec:
  selector:
    matchLabels: {app: kafka-ui}
  template:
    metadata:
      labels: {app: kafka-ui}
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka-ui
          image: ${KAFKA_UI_IMAGE}
          imagePullPolicy: Never
          env:
            - {name: KAFKA_CLUSTERS_0_NAME, value: nuna}
            - {name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "kafka:9092"}
            # The CDC leg's Kafka Connect (cdc.yaml): its connectors, their tasks and configs. Unreachable
            # while the leg is stopped.
            - {name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME, value: cdc}
            - {name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS, value: "http://connect:8083"}
            - {name: DYNAMIC_CONFIG_ENABLED, value: "false"}
            # Off: on by default, it asks api.github.com for kafbat's latest release every hour.
            - {name: GITHUB_RELEASE_INFO_ENABLED, value: "false"}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          # It uses about 350 MB. Reserving its whole limit, as a limit alone does, left no room in the demo
          # for CloudBeaver beside the CDC leg.
          resources:
            requests: {memory: 384Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  selector: {app: kafka-ui}
  ports:
    - port: 8080
