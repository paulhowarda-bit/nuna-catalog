# The stack the demo and the engine matrix share, part 1: PostgreSQL and the token issuer's key server; Kafka and
# kafbat are in kafka.yaml. Part 2 is the S3 store (store-silo.yaml or store-ceph.yaml, then seed.yaml), part 3
# the catalog (the Helm chart with catalog-values.yaml), part 4 SingleStore (singlestore.yaml). demo/demo.sh and
# EngineMatrixTest both apply them. Images are never pulled by the cluster: Docker Desktop's runs them from the
# local Docker engine, and the harness loads them into kind.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18.7
          imagePullPolicy: Never
          args: ["-c", "shared_buffers=64MB", "-c", "max_connections=50"]
          env:
            - {name: POSTGRES_DB, value: catalog}
            - {name: POSTGRES_USER, value: catalog}
            - {name: POSTGRES_PASSWORD, value: catalog}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "catalog", "-d", "catalog"]
            periodSeconds: 2
          resources:
            limits: {memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
# Serves the issuer's JWKS (ConfigMap idp-keys: demo/Mint.java's key for the demo, the harness's own for a
# matrix run on its own) so the catalog fetches its keys inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp
spec:
  selector:
    matchLabels: {app: idp}
  template:
    metadata:
      labels: {app: idp}
    spec:
      enableServiceLinks: false
      containers:
        - name: idp
          image: busybox:1.37.0
          imagePullPolicy: Never
          command: ["httpd", "-f", "-p", "8080", "-h", "/srv"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
          volumeMounts:
            - {name: keys, mountPath: /srv, readOnly: true}
      volumes:
        - name: keys
          configMap:
            name: idp-keys
---
apiVersion: v1
kind: Service
metadata:
  name: idp
spec:
  selector: {app: idp}
  ports:
    - port: 8080
