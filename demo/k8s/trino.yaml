# Trino, one node, with catalogs lakehouse and engines from nuna: every nested namespace listed, storage reached
# with the credentials the catalog vends. Only demo.sh applies this; CloudBeaver (cloudbeaver.yaml) is its UI,
# and nothing publishes Trino itself.
#
# lakehouse_dev is the same catalog through its branch dev (D33): nuna takes the warehouse lakehouse@dev as the
# branch, so reads see the branch and commits land on it, never on main. demo.sh up makes dev (refs). Trino asks
# nuna for a catalog's config only at its first query, so it starts whether or not dev exists; while it does not
# (merged or deleted), every query there fails with nuna's 404, and a new branch named dev is read again at once.
#
# Each query reaches nuna as whoever runs it: the client sends its own catalog token as Trino's extra credential
# "token" (session USER), and Trino hands it to nuna, which checks it as it checks any engine's. CloudBeaver's
# connections send the signed-in person's. A query without one fails: Trino then asks nuna to exchange a token,
# and nuna issues none (D13). Trino's own token, as user trino (Mint.java), reads the catalogs' config and vouches for each
# query's user (below): it holds no grant, but demo.sh registers its client, trino-demo, as a trusted engine (D17), which sees every
# catalog and nothing in it (D18).
#
# Row filters and column masks (D20, backlog 115): Trino asks nuna, as its OPA access control
# (access-control.properties), for each user's filter and masks on a table, forwarding the user's own token
# (opa.identity.extra-credentials-keys=token), and applies them; nuna answers from the rules the grant admin set.
# A table with rules is flagged, and nuna gives a flagged table's files only to a trusted engine (D20): every
# catalog request also carries Trino's own token in X-Nuna-Engine-Authorization, so nuna sees Trino acting for the
# user the Authorization token names, with that token's groups. A client reading nuna without Trino gets 403 on a
# flagged table's data. jvm.config is the image's own with a 768 MB heap in place of 80% of the container, to fit
# beside the rest of the demo on the cluster's 8 GB node; demo.sh engines stops Trino for the run, as Spark needs
# the room.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
data:
  jvm.config: |
    -server
    -agentpath:/usr/lib/trino/bin/libjvmkill.so
    -Xmx768m
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -XX:-OmitStackTraceInFastThrow
    -XX:ReservedCodeCacheSize=256M
    -XX:PerMethodRecompilationCutoff=10000
    -XX:PerBytecodeRecompilationCutoff=10000
    -Djdk.attach.allowAttachSelf=true
    -Djdk.nio.maxCachedBufferSize=2000000
  access-control.properties: |
    access-control.name=opa
    opa.policy.uri=http://nuna-catalog:8181/opa/v1/allow
    opa.policy.row-filters-uri=http://nuna-catalog:8181/opa/v1/row-filters
    opa.policy.batch-column-masking-uri=http://nuna-catalog:8181/opa/v1/column-masks
    opa.identity.extra-credentials-keys=token
  lakehouse.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://nuna-catalog:8181
    iceberg.rest-catalog.warehouse=lakehouse
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.token=${ENV:NUNA_TOKEN}
    iceberg.rest-catalog.session=USER
    iceberg.rest-catalog.http-headers=X-Nuna-Engine-Authorization: Bearer ${ENV:NUNA_TOKEN}
    iceberg.rest-catalog.vended-credentials-enabled=true
    iceberg.rest-catalog.nested-namespace-enabled=true
    iceberg.rest-catalog.server-assigned-table-location-enabled=true
    fs.native-s3.enabled=true
    s3.endpoint=${S3_ENDPOINT}
    s3.region=us-east-1
    s3.path-style-access=true
  lakehouse_dev.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://nuna-catalog:8181
    iceberg.rest-catalog.warehouse=lakehouse@dev
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.token=${ENV:NUNA_TOKEN}
    iceberg.rest-catalog.session=USER
    iceberg.rest-catalog.http-headers=X-Nuna-Engine-Authorization: Bearer ${ENV:NUNA_TOKEN}
    iceberg.rest-catalog.vended-credentials-enabled=true
    iceberg.rest-catalog.nested-namespace-enabled=true
    iceberg.rest-catalog.server-assigned-table-location-enabled=true
    fs.native-s3.enabled=true
    s3.endpoint=${S3_ENDPOINT}
    s3.region=us-east-1
    s3.path-style-access=true
  engines.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://nuna-catalog:8181
    iceberg.rest-catalog.warehouse=engines
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.token=${ENV:NUNA_TOKEN}
    iceberg.rest-catalog.session=USER
    iceberg.rest-catalog.http-headers=X-Nuna-Engine-Authorization: Bearer ${ENV:NUNA_TOKEN}
    iceberg.rest-catalog.vended-credentials-enabled=true
    iceberg.rest-catalog.nested-namespace-enabled=true
    iceberg.rest-catalog.server-assigned-table-location-enabled=true
    fs.native-s3.enabled=true
    s3.endpoint=${S3_ENDPOINT}
    s3.region=us-east-1
    s3.path-style-access=true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
spec:
  replicas: 1
  selector:
    matchLabels: {app: trino}
  template:
    metadata:
      labels: {app: trino}
      # Trino reads its configuration and its token only as it starts, so a changed file or new tokens replace
      # the pod.
      annotations:
        nuna-demo/manifest: "${MANIFEST_HASH}"
        nuna-demo/tokens: "${TOKENS_HASH}"
    spec:
      enableServiceLinks: false
      containers:
        - name: trino
          image: ${TRINO_IMAGE}
          imagePullPolicy: Never
          env:
            - name: NUNA_TOKEN
              valueFrom:
                secretKeyRef: {name: demo-trino-token, key: token}
          volumeMounts:
            - {name: config, mountPath: /etc/trino/jvm.config, subPath: jvm.config}
            - {name: config, mountPath: /etc/trino/access-control.properties, subPath: access-control.properties}
            - {name: catalogs, mountPath: /etc/trino/catalog}
          startupProbe:
            exec:
              command: ["/usr/lib/trino/bin/health-check"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/usr/lib/trino/bin/health-check"]
            periodSeconds: 10
          resources:
            requests: {memory: 768Mi}
            limits: {memory: 1280Mi}
      volumes:
        - name: config
          configMap: {name: trino-config}
        - name: catalogs
          configMap:
            name: trino-config
            items:
              - {key: lakehouse.properties, path: lakehouse.properties}
              - {key: lakehouse_dev.properties, path: lakehouse_dev.properties}
              - {key: engines.properties, path: engines.properties}
---
apiVersion: v1
kind: Service
metadata:
  name: trino
spec:
  selector: {app: trino}
  ports:
    - port: 8080
      targetPort: 8080
