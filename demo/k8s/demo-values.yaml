# The demo's catalog values, on top of catalog-values.yaml: its image tag, profile s3 on the stack's Silo, the
# audit catalog nuna_audit, and two issuers: demo/Mint.java's tokens (keys served by Service idp) and Keycloak's (keycloak.yaml), which the
# console signs people in with by username and password. Both name a user by the same id (ana is ana at
# either), so grants and audit see one person. Test keys only.
image:
  tag: demo

config:
  nuna:
    storage:
      require-tls: false
      profiles:
        s3:
          kind: MINIO
          endpoint: http://s3:9000
          region: us-east-1
          table-root: s3://warehouse/tables
          allowed-prefixes: [s3://warehouse/tables]
          access-key-id: nunatest
          # The maintenance worker's own Silo user (maintenance-values.yaml): the worker reads this profile's
          # prefixes only because it names one (item 256).
          maintenance-principal: nuna-maintenance
      # The audit catalog of the queryable audit tables (D23): the audit table writer (audit-tables-values.yaml)
      # fills nuna_audit.audit.events from the audit topic, and the console's Audit page reads it back.
      catalogs:
        nuna_audit:
          profile: s3
          kms-key-set: demo-keys
          legal-entity: Demo Entity
    audit:
      # At startup the server grants the readers select on nuna_audit, which the Audit page needs (gary and
      # presenter, in Keycloak and Mint.java), and the writer's group create and write there (Keycloak's service
      # account of client nuna-audit-tables). The readers' group may not be demo-grant-admins: the server refuses
      # to grant a grant admin group anything (D18).
      tables:
        catalog: nuna_audit
        readers: demo-auditors
        writers: demo-audit-writers
      # No Kafka: the demo's catalog audits to its log (D23, amended 2026-11-23), and Kafka runs only while the
      # brokerage world's generator or the CDC leg does (D50). catalog-values.yaml, which the engine matrix shares,
      # keeps its Kafka.
      kafka-bootstrap-servers: ""
    security:
      # The maintenance worker (maintenance-values.yaml), Keycloak's service account of client nuna-maintenance, which
      # purges and which the worker's own routes answer (D30); and presenter, who may do everything (backlog 273).
      maintenance-principals: [service-account-nuna-maintenance, presenter]
      # presenter grants to and sets row filters and column masks for their own groups, which no one else may
      # (Paul, 2026-11-25: D18 amended; backlog 273). Never set at work.
      own-group-principals: [presenter]
      issuers:
        - issuer: https://idp.demo/nuna
          jwks-uri: http://idp:8080/keys.json
          audiences: [nuna-catalog]
          algorithms: [RS256]
          user-id-claim: sub
          groups-claim: groups
          client-id-claim: azp
        - issuer: https://${DEMO_HOST}:8180/realms/nuna
          jwks-uri: http://keycloak:8080/realms/nuna/protocol/openid-connect/certs
          audiences: [nuna-catalog]
          algorithms: [RS256]
          user-id-claim: preferred_username
          groups-claim: groups
          client-id-claim: azp
    # Trino's catalogs (trino.yaml), each to the warehouse it reads, so nuna can answer Trino's OPA access control
    # with each user's row filter and column masks (D20, backlog 115).
    opa:
      catalogs:
        lakehouse: lakehouse
        lakehouse_dev: lakehouse@dev
        engines: engines
    ui:
      oidc:
        issuer: https://${DEMO_HOST}:8180/realms/nuna
        client-id: nuna-console

# The catalog's logs, the audit log nuna.audit among them, go over OTLP to the audit table writer's receiver, which
# keeps nuna.audit's records for the Audit page (audit-tables-values.yaml); metrics and traces go nowhere. The
# token is the one demo.sh makes once in ~/.nuna-demo/keycloak/audit-otlp-token.
telemetry:
  logsEndpoint: http://nuna-audit-tables:4318/v1/logs
  logsTokenSecret:
    name: keycloak-keys
    key: audit-otlp-token

secrets:
  values:
    nuna.storage.profiles.s3.secret-access-key: ${S3_SECRET_KEY}
