# The demo's catalog values, on top of catalog-values.yaml: its image tag, profile s3 on the stack's Silo, and
# two issuers: demo/Mint.java's tokens (keys served by Service idp) and Keycloak's (keycloak.yaml), which the
# console signs people in with by username and password. Both name a user by the same id (ana is ana at
# either), so grants and audit see one person. Test keys only.
image:
  tag: demo

config:
  keel:
    storage:
      require-tls: false
      profiles:
        s3:
          kind: MINIO
          endpoint: http://s3:9000
          region: us-east-1
          table-root: s3://warehouse/tables
          allowed-prefixes: [s3://warehouse/tables]
          access-key-id: keeltest
    security:
      issuers:
        - issuer: https://idp.demo/keel
          jwks-uri: http://idp:8080/keys.json
          audiences: [keel-catalog]
          algorithms: [RS256]
          user-id-claim: sub
          groups-claim: groups
          client-id-claim: azp
        - issuer: https://${DEMO_HOST}:8180/realms/keel
          jwks-uri: http://keycloak:8080/realms/keel/protocol/openid-connect/certs
          audiences: [keel-catalog]
          algorithms: [RS256]
          user-id-claim: preferred_username
          groups-claim: groups
          client-id-claim: azp
    ui:
      oidc:
        issuer: https://${DEMO_HOST}:8180/realms/keel
        client-id: keel-console

secrets:
  values:
    keel.storage.profiles.s3.secret-access-key: keeltest-secret-key
