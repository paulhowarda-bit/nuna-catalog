# The demo's ports on localhost, where Docker Desktop serves LoadBalancer Services, all HTTPS through one front
# door: 8180 Keycloak, 8181 the catalog and its console, 8182 kafbat, 8183 SingleStore Studio, 8184 Silo's
# console, 8185 CloudBeaver (Trino), 8186 Kafka Connect's REST API (connect.yaml), 8187
# Silo's S3 API, for engines on other machines. Only demo.sh applies this; a matrix run publishes nothing.
#
# The front door is nginx (Deployment front): it ends TLS with the certificate in Secret demo-tls, which demo.sh
# makes from ~/.nuna-demo/tls (publish_tls), and passes each request on over plain HTTP inside the cluster, to
# the same Services the stack's pods use; only Studio is HTTPS behind it too, with the same certificate. So the
# certificate is in one place, and work's replaces the demo's there. Each request carries X-Forwarded-Proto https and its Host, from which Keycloak and kafbat build their
# addresses, and nginx turns any http:// redirect a service sends into https://. Plain http to a port is sent to
# https. nginx looks each Service up as a request arrives, so it starts before SingleStore, CloudBeaver and
# Kafka Connect exist and answers 502 for one that does not run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
spec:
  selector:
    matchLabels: {app: front}
  template:
    metadata:
      labels: {app: front}
      # A new certificate or configuration replaces the pod.
      annotations: {nuna-demo/tls: "${TLS_HASH}", nuna-demo/config: "${MANIFEST_HASH}"}
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: ${NGINX_IMAGE}
          imagePullPolicy: Never
          # A pod being replaced keeps serving for a while: Docker Desktop's LoadBalancer can still send it a
          # new connection, which otherwise hangs and fails its TLS handshake.
          lifecycle:
            preStop:
              exec: {command: ["sleep", "10"]}
          env:
            # The image's entrypoint puts the pod's DNS servers in NGINX_LOCAL_RESOLVERS, for the template below.
            - {name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS, value: "1"}
            # One worker per CPU of the limit below, two, not one per CPU of the machine: the memory then does
            # not grow with the machine.
            - {name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE, value: "1"}
          ports:
            - {containerPort: 8180}
            - {containerPort: 8181}
            - {containerPort: 8182}
            - {containerPort: 8183}
            - {containerPort: 8184}
            - {containerPort: 8185}
            - {containerPort: 8186}
            - {containerPort: 8187}
          readinessProbe:
            tcpSocket: {port: 8181}
            periodSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/templates, readOnly: true}
            - {name: tls, mountPath: /etc/nginx/tls, readOnly: true}
          resources:
            requests: {memory: 16Mi}
            limits: {memory: 64Mi, cpu: "2"}
      volumes:
        - name: config
          configMap: {name: front}
        - name: tls
          secret: {secretName: demo-tls}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: front
data:
  # The image fills in ${NGINX_LOCAL_RESOLVERS} and writes /etc/nginx/conf.d/front.conf; nginx's own $names stay.
  front.conf.template: |
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # WebSockets (CloudBeaver, Silo's console) and streamed answers (kafbat's messages).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_redirect http:// https://;
    # Uploads to Silo's console and connector configs: any size.
    client_max_body_size 0;
    error_page 497 =301 https://$http_host$request_uri;

    server { listen 8180 ssl; location / { set $to keycloak.${NAMESPACE}.svc.cluster.local:8080; proxy_pass http://$to; } }
    server { listen 8181 ssl; location / { set $to nuna-catalog.${NAMESPACE}.svc.cluster.local:8181; proxy_pass http://$to; } }
    server { listen 8182 ssl; location / { set $to kafka-ui.${NAMESPACE}.svc.cluster.local:8080; proxy_pass http://$to; } }
    # Studio serves HTTPS itself (singlestore.Dockerfile says why), with the same certificate; nginx does not check it.
    server { listen 8183 ssl; location / { set $to singlestore.${NAMESPACE}.svc.cluster.local:8080; proxy_pass https://$to; } }
    server { listen 8184 ssl; location / { set $to s3.${NAMESPACE}.svc.cluster.local:9001; proxy_pass http://$to; } }
    # CloudBeaver's sign-in proxy (cloudbeaver.yaml); CloudBeaver itself answers on the pod's 127.0.0.1.
    server { listen 8185 ssl; location / { set $to cloudbeaver.${NAMESPACE}.svc.cluster.local:4180; proxy_pass http://$to; } }
    server { listen 8186 ssl; location / { set $to connect.${NAMESPACE}.svc.cluster.local:8083; proxy_pass http://$to; } }
    # Silo's S3 API, for an engine off this machine: the catalog vends http://s3:9000, which resolves only in the
    # cluster, so such an engine sets s3.endpoint to https://<host>:8187 itself. Its signatures cover the Host
    # header, which passes through unchanged, so Silo checks them against the address the engine used.
    server { listen 8187 ssl; location / { set $to s3.${NAMESPACE}.svc.cluster.local:9000; proxy_pass http://$to; } }
---
# One Service per port, under the names they had before the front door, so an up over an older demo moves each
# port rather than publishing it twice.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-public
spec:
  type: LoadBalancer
  selector: {app: front}
  ports:
    - {port: 8180, targetPort: 8180}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-public
spec:
  type: LoadBalancer
  selector: {app: front}
  ports:
    - {port: 8181, targetPort: 8181}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui-public
spec:
  type: LoadBalancer
  selector: {app: front}
  ports:
    - {port: 8182, targetPort: 8182}
---
apiVersion: v1
kind: Service
metadata:
  name: singlestore-studio
spec:
  type: LoadBalancer
  selector: {app: front}
  ports:
    - {port: 8183, targetPort: 8183}
---
apiVersion: v1
kind: Service
metadata:
  name: silo-console
spec:
  type: LoadBalancer
  selector: {app: front}
  ports:
    - {port: 8184, targetPort: 8184}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver-public
spec:
  type: LoadBalancer
  selector: {app: front}
  ports:
    - {port: 8185, targetPort: 8185}
---
apiVersion: v1
kind: Service
metadata:
  name: connect-public
spec:
  type: LoadBalancer
  selector: {app: front}
  ports:
    - {port: 8186, targetPort: 8186}
---
apiVersion: v1
kind: Service
metadata:
  name: s3-public
spec:
  type: LoadBalancer
  selector: {app: front}
  ports:
    - {port: 8187, targetPort: 8187}
