# The demo's ports on localhost, where Docker Desktop serves LoadBalancer Services: 8180 Keycloak, 8181 the
# catalog and its console, 8182 kafbat, 8183 SingleStore Studio, 8184 Silo's console, 8185 CloudBeaver (Trino),
# 8186 Kafka Connect's REST API (only while demo.sh cdc runs, cdc.yaml). Only demo.sh applies this; a matrix run
# publishes nothing.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-public
spec:
  type: LoadBalancer
  selector: {app: keycloak}
  ports:
    - port: 8180
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-public
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: keel-catalog
    app.kubernetes.io/instance: keel-catalog
  ports:
    - port: 8181
      targetPort: 8181
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui-public
spec:
  type: LoadBalancer
  selector: {app: kafka-ui}
  ports:
    - port: 8182
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: singlestore-studio
spec:
  type: LoadBalancer
  selector: {app: singlestore}
  ports:
    - port: 8183
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: silo-console
spec:
  type: LoadBalancer
  selector: {app: s3}
  ports:
    - port: 8184
      targetPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbeaver-public
spec:
  type: LoadBalancer
  selector: {app: cloudbeaver}
  ports:
    # The sign-in proxy beside CloudBeaver (cloudbeaver.yaml); CloudBeaver itself answers on the pod's 127.0.0.1.
    - port: 8185
      targetPort: 4180
---
apiVersion: v1
kind: Service
metadata:
  name: connect-public
spec:
  type: LoadBalancer
  selector: {app: connect}
  ports:
    - port: 8186
      targetPort: 8083
