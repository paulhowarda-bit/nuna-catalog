# The catalog, part 3 of the shared stack: the Helm chart's values that demo.sh and EngineMatrixTest both use.
# One server sized for a one-node cluster, its image from the local Docker engine. Two catalogs on one storage
# profile, s3 (each table gets its own folder under the table root): lakehouse for the demo's data, engines
# for the engine matrix. Each launcher adds the image tag, the issuer and profile s3 for its store: demo.sh
# with demo-values.yaml, the harness with values of its own. Test settings only; the token box is on.
replicaCount: 1

image:
  repository: nuna-catalog
  pullPolicy: Never

# A 1Gi limit with the heap at 60%: at 768Mi and 75% the brokerage world's sink load took the pod over its limit
# outside the heap, and the kernel killed it (backlog 179). The request stays 768Mi: the demo's node has 94% of its
# memory requested, and a 1Gi request did not schedule beside the pod it replaces.
resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 1Gi

javaToolOptions: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"

config:
  spring:
    datasource:
      # Over TLS, checking the server's certificate and name, and signing in by the catalog's client certificate: the
      # stack's PostgreSQL lets user catalog in from the network by certificate alone, and no role has a password
      # (stack.yaml; backlog 281). The files are Secret catalog-db-tls, below, which demo.sh and the engine matrix make.
      url: jdbc:postgresql://postgres:5432/catalog?sslmode=verify-full&sslrootcert=/etc/nuna/db-tls/ca.crt&sslcert=/etc/nuna/db-tls/client.crt&sslkey=/etc/nuna/db-tls/client.pk8
      username: catalog
  nuna:
    database:
      # The stack's PostgreSQL is one node, so the self-check reports no synchronous standby, which would refuse to
      # start the server (D8.2). Test settings only.
      allow-unsafe: [pg.no-sync-standby]
    storage:
      catalogs:
        lakehouse:
          profile: s3
          kms-key-set: demo-keys
          legal-entity: Demo Entity
        engines:
          profile: s3
          kms-key-set: test-keys
          legal-entity: Test Entity
    security:
      grant-admin-groups: [demo-grant-admins]
      platform-operator-groups: [demo-operators]
    audit:
      kafka-bootstrap-servers: kafka:9092
    ui:
      dev-token-login: true

# The database's CA, the catalog's client certificate and its key as PKCS #8 DER (ca.crt, client.crt, client.pk8),
# mounted at /etc/nuna/db-tls, where the URL above names them.
databaseTls:
  secretName: catalog-db-tls
