# The brokerage world's generator (D48, demo-datagen, image brokerage.Dockerfile), live in every demo.sh up: it
# plays the firm's trading days on the real clock (each event at its own time of day in New York, quiet overnight,
# over weekends and on holidays; D48, Paul, 2026-11-23), books every financial
# transaction through the demo kit's posting engine, and sends the world's events to two places, from where the
# demo's pipelines bring them into Iceberg:
#   Kafka        topics brokerage.*, which Kafka Connect's sink brokerage-lake (demo/brokerage/connector.json)
#                writes to the tables under brokerage.reference, .markets, .party, .ledger and .clearing
#   SingleStore  table brokerage.orders, which the change feed brokerage_orders_to_lake (demo/singlestore/feeds.sql)
#                copies to brokerage.trading.orders, and the order management system's tables order_events, routes
#                and executions, which brokerage_oms_to_lake copies to brokerage.trading (item 151)
# BROKERAGE_ROUTE says which of the two are on (demo.sh's switches kafka and ss; D50, backlog 238). With SingleStore
# off, the order management system's rows go through topics brokerage.oms.* to brokerage.kafka, and the orders
# nowhere; with Kafka off, every other feed goes into a SingleStore table of its own
# (demo/singlestore/brokerage-feeds.sql), whose change feed copies it to brokerage.singlestore.
# demo.sh up starts it last, after its bootstrap Job (brokerage-bootstrap.yaml, whose environment this repeats),
# the tables' governance and the sink. demo.sh cdc stops it (the leg needs its memory) and cdc stop starts it again;
# up, rate and engines stop it while they need its room (pause_world).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokerage
spec:
  replicas: 1
  # One generator at a time: two would write the world twice.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: brokerage}
  template:
    metadata:
      labels: {app: brokerage}
      # A rebuilt image or new tokens replace the pod: it reads its token only as it starts.
      annotations:
        nuna-demo/image: "${BROKERAGE_IMAGE_ID}"
        nuna-demo/tokens: "${TOKENS_HASH}"
    spec:
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: brokerage
          image: ${BROKERAGE_IMAGE}
          imagePullPolicy: Never
          args: ["run"]
          env:
            - {name: NUNA_CATALOG_URI, value: "http://nuna-catalog:8181"}
            - {name: NUNA_WAREHOUSE, value: lakehouse}
            - name: NUNA_TOKEN
              valueFrom:
                secretKeyRef: {name: demo-brokerage-token, key: token}
            - {name: KAFKA_BOOTSTRAP, value: "kafka:9092"}
            # Kafka Connect's REST API: the generator restarts the sink's task when it has failed.
            - {name: CONNECT_URL, value: "http://connect:8083"}
            - {name: SINGLESTORE_URL, value: "jdbc:mariadb://singlestore:3306/brokerage"}
            - {name: SINGLESTORE_USER, value: root}
            - name: SINGLESTORE_PASSWORD
              valueFrom: {secretKeyRef: {name: singlestore-root, key: password}}
            - {name: BROKERAGE_ROUTE, value: "${BROKERAGE_ROUTE}"}
            # The world's scale, fixed when it begins (demo.sh: NUNA_DEMO_ACCOUNTS, NUNA_DEMO_SECURITIES,
            # NUNA_DEMO_CATCH_UP_DAYS; item 154).
            - {name: BROKERAGE_ACCOUNTS, value: "${BROKERAGE_ACCOUNTS}"}
            - {name: BROKERAGE_SECURITIES, value: "${BROKERAGE_SECURITIES}"}
            - {name: BROKERAGE_CATCH_UP_DAYS, value: "${BROKERAGE_CATCH_UP_DAYS}"}
            - {name: BROKERAGE_SEED, value: "20261122"}
            - {name: BROKERAGE_COMMIT_INTERVAL_MS, value: "15000"}
          securityContext: {allowPrivilegeEscalation: false}
          resources:
            # 256 MB of up to 384 MB at up to 2,000 accounts, 64 MB more of the limit for each 1,000 above (demo.sh
            # world_memory; item 154).
            requests: {memory: ${BROKERAGE_MEMORY_REQUEST}Mi}
            limits: {memory: ${BROKERAGE_MEMORY_LIMIT}Mi}
