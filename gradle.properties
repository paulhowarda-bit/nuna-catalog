# Two tasks at once, so at most two test JVMs and their containers. Not more: Docker has 8 GB, and
# a three-node cluster plus one other stack is what fits.
org.gradle.parallel=true
org.gradle.workers.max=2

# The local build cache (in ~/.gradle/caches, outside the checkout): a fresh worktree reuses the
# compiled classes and test results of every module whose inputs did not change.
org.gradle.caching=true

# Java 25 comes from a JDK already installed on the machine; Gradle never downloads one.
org.gradle.java.installations.auto-download=false

# Versions Boot does not manage are pinned here; sources in research_notes/Build plan facts/.
iceberg.version=1.12.0
# iceberg-core 1.12.0 is built on Jackson 2.22.2; Boot 4.1.2 manages 2.21.7.
jackson-2-bom.version=2.22.2
# 7.1.0 fixes a virtual-thread spin; Boot 4.1.2 manages 7.0.2.
hikaricp.version=7.1.0
# Boot does not manage the AWS SDK; research_notes/Build plan facts/object_stores.md S.1.
aws-sdk.version=2.57.10

# Container images the tests read as system properties.
postgres.image=postgres:18
# Matches the kafka-clients version Boot 4.1.2 manages (4.2.2).
kafka.image=apache/kafka:4.2.2
toxiproxy.image=ghcr.io/shopify/toxiproxy:2.12.0
cockroachdb.image=cockroachdb/cockroach:v25.4.20
# The one S3 store every test uses: silo (the default), ceph or aws (catalog-tests-s3, TestS3).
# -Ps3=ceph picks another; with -Ps3=aws, -Pfidice.aws.profile names the AWS CLI profile to sign in
# through (short-lived credentials only; the tests never read, print or store them).
s3=silo
# Silo, the maintained MinIO fork (research F5, 5.14).
silo.image=pgsty/silo:RELEASE.2026-10-26T00-00-00Z
# Ceph RGW in one container (research F7).
ceph.image=ghcr.io/clyso/ceph-test:v20.2.5
# Two realms stand in for Entra ID and Ping (D17a).
keycloak.image=quay.io/keycloak/keycloak:26.8.2
