# Database connection comes from the environment (SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD).
spring:
  application:
    name: nuna-catalog
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
server:
  port: 8181

# Telemetry (docs/observability/README.md). Metrics, traces and logs go over OTLP only when an endpoint is set: the
# standard OTEL_* variables, or Boot's management.* properties. Log lines go to stdout as JSON, in Elastic Common
# Schema; each written while a request runs carries its traceId, spanId and requestId.
logging:
  # Every audit record is a line of the log nuna.audit (D23, amended 2026-11-23; docs/observability/audit-log.md). It
  # stays at INFO when the root level is raised; the server refuses to start with it coarser than INFO.
  level:
    nuna.audit: INFO
  structured:
    format:
      console: ecs
