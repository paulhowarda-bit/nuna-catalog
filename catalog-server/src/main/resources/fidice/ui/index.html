<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fidice catalog</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">fidice <span class="brand-sub">catalog</span></span>
    <label class="catalog-pick" id="catalog-pick" hidden>
      <span class="muted">Catalog</span>
      <select id="catalog-select" aria-label="Catalog"></select>
    </label>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button type="button" class="ghost" id="theme-toggle" title="Switch light or dark">Theme</button>
    <button type="button" class="ghost" id="sign-out" hidden>Sign out</button>
  </header>
  <main id="main">
    <p class="loading">Loading…</p>
  </main>
  <noscript>The fidice catalog console needs JavaScript.</noscript>
</body>
</html>
