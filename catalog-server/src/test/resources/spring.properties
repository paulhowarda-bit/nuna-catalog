# One test context at a time (backlog 123). Spring closes the last context when a class needs another, and with it
# that context's containers (PostgreSQL, the governance tests' Kafka, and what StopWithContext registers), so this
# module holds in Docker only what the running class uses. The default, 32, kept every context of the run alive to
# its end: about 4 GB of idle containers, which with another module's stack beside them filled Docker's memory and
# swap. Classes that share a context run one after another (classes run in name order, and a package's share one),
# so this costs about three context starts in a run.
spring.test.context.cache.maxSize=1
