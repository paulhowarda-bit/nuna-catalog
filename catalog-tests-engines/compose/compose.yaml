# The nightly engine matrix (M8, D31). EngineMatrixTest drives it; see ../README.md.
#
# The base stack is PostgreSQL, Kafka, Silo and the catalog server (the catalog-server exec jar on a
# JDK 25 JRE). Each engine is a profile, brought up on its own, run, and removed. Nothing publishes a
# host port: every client runs inside this network, so the storage profile's endpoint
# (http://silo:9000) is the one engines reach with vended credentials.
#
# The harness sets:
#   CATALOG_JAR   the catalog-server exec jar
#   RUN_DIR       a directory holding idp/keys.json (the test issuer's JWKS)
#   FIDICE_TOKEN  a bearer token from that issuer, for group engine-clients

name: fidice-engines

x-silo-env: &silo-env
  MINIO_ROOT_USER: fidicetest
  MINIO_ROOT_PASSWORD: fidicetest-secret-key

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "catalog", "-d", "catalog"]
      interval: 2s
      timeout: 5s
      retries: 60

  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 2s
      timeout: 5s
      retries: 60

  silo:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    environment: *silo-env
    command: ["server", "/data"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Creates the warehouse bucket and publishes the test issuer's JWKS as a public-read object, so the
  # catalog fetches its keys from inside the network.
  seed:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: ["sh", "-ec"]
    command:
      - |
        mc alias set s http://silo:9000 fidicetest fidicetest-secret-key >/dev/null
        mc mb --ignore-existing s/warehouse s/idp
        mc anonymous set download s/idp
        mc cp /seed/keys.json s/idp/keys.json
    volumes:
      - type: bind
        source: ${RUN_DIR:?RUN_DIR}/idp
        target: /seed
        read_only: true

  catalog:
    image: eclipse-temurin:25.0.5_8-jre-noble
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      SPRING_DATASOURCE_USERNAME: catalog
      SPRING_DATASOURCE_PASSWORD: catalog
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m
    command: ["java", "-jar", "/app/catalog.jar", "--spring.config.additional-location=file:/app/engines.properties"]
    volumes:
      - type: bind
        source: ${CATALOG_JAR:?CATALOG_JAR}
        target: /app/catalog.jar
        read_only: true
      - type: bind
        source: ./catalog/engines.properties
        target: /app/engines.properties
        read_only: true
    mem_limit: 900m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8181"]
      interval: 2s
      timeout: 5s
      retries: 120

  spark:
    profiles: ["spark"]
    build: ./spark
    image: fidice-engines/spark:4.1.4-iceberg-1.12.0
    environment:
      FIDICE_TOKEN: ${FIDICE_TOKEN:?FIDICE_TOKEN}
    entrypoint: ["bash", "/scripts/run.sh"]
    volumes:
      - ./spark:/scripts:ro
    mem_limit: 2g

  flink:
    profiles: ["flink"]
    build: ./flink
    image: fidice-engines/flink:2.3.0-iceberg-1.12.0
    environment:
      FIDICE_TOKEN: ${FIDICE_TOKEN:?FIDICE_TOKEN}
    entrypoint: ["bash", "/scripts/run.sh"]
    volumes:
      - ./flink:/scripts:ro
    mem_limit: 2g

  trino:
    profiles: ["trino"]
    image: trinodb/trino:484
    environment:
      FIDICE_TOKEN: ${FIDICE_TOKEN:?FIDICE_TOKEN}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino:/scripts:ro
    # The image sizes the heap at 80% of the container's memory.
    mem_limit: 1800m
    # The image's own check gives up after about 40 s, too soon on a busy laptop.
    healthcheck:
      test: ["CMD-SHELL", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      start_period: 5m
      retries: 3

  pyiceberg:
    profiles: ["pyiceberg"]
    build: ./python
    image: fidice-engines/python:pyiceberg-0.12.0-duckdb-2.0.0
    environment:
      FIDICE_TOKEN: ${FIDICE_TOKEN:?FIDICE_TOKEN}
    command: ["python", "-u", "/scripts/pyiceberg_matrix.py"]
    volumes:
      - ./python:/scripts:ro
    mem_limit: 1g

  duckdb:
    profiles: ["duckdb"]
    build: ./python
    image: fidice-engines/python:pyiceberg-0.12.0-duckdb-2.0.0
    environment:
      FIDICE_TOKEN: ${FIDICE_TOKEN:?FIDICE_TOKEN}
    command: ["python", "-u", "/scripts/duckdb_matrix.py"]
    volumes:
      - ./python:/scripts:ro
    mem_limit: 1g
