# The catalog server inside the engine-matrix network. Shape copied from ConformanceServer. Storage
# profile s3 (silo, ceph or aws) comes from storage.properties, which the harness writes for the run's store.
fidice.storage.catalogs.engines.profile=s3
fidice.storage.catalogs.engines.kms-key-set=test-keys
fidice.storage.catalogs.engines.legal-entity=Test Entity

fidice.security.issuers[0].issuer=https://idp.test/engines
fidice.security.issuers[0].jwks-uri=http://idp:8080/keys.json
fidice.security.issuers[0].audiences=fidice-catalog
fidice.security.issuers[0].algorithms=RS256
fidice.security.issuers[0].user-id-claim=sub
fidice.security.issuers[0].groups-claim=groups
fidice.security.issuers[0].client-id-claim=azp

fidice.audit.kafka-bootstrap-servers=kafka:9092
