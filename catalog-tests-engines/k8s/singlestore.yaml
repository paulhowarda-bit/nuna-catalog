# SingleStore, a read-only Iceberg client (D35), started for its test only. The harness runs SQL in it with
# kubectl exec.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: singlestore
spec:
  selector:
    matchLabels: {app: singlestore}
  template:
    metadata:
      labels: {app: singlestore}
    spec:
      enableServiceLinks: false
      containers:
        - name: singlestore
          image: ${SINGLESTORE_IMAGE}
          imagePullPolicy: Never
          env:
            - {name: ROOT_PASSWORD, value: fidice-test}
          ports:
            - containerPort: 3306
          # The image's own health check: its start script has finished (/server/.ready), and the master and leaf
          # answer. Port 3306 opens before the start script has set root's password, so a port check let the
          # harness in too early (Access denied for user 'root').
          startupProbe:
            exec:
              command: ["/scripts/healthcheck.sh"]
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 120
          resources:
            requests: {memory: 2Gi}
