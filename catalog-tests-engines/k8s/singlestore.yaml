# SingleStore, a read-only Iceberg client (D35), started for its test only. The harness runs SQL in it with
# kubectl exec.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: singlestore
spec:
  selector:
    matchLabels: {app: singlestore}
  template:
    metadata:
      labels: {app: singlestore}
    spec:
      enableServiceLinks: false
      containers:
        - name: singlestore
          image: ${SINGLESTORE_IMAGE}
          imagePullPolicy: Never
          env:
            - {name: ROOT_PASSWORD, value: fidice-test}
          ports:
            - containerPort: 3306
          startupProbe:
            tcpSocket:
              port: 3306
            periodSeconds: 5
            failureThreshold: 120
          resources:
            requests: {memory: 2Gi}
