# The catalog settings a matrix run on its own adds to the shared stack's (demo/k8s/catalog-values.yaml): its
# test issuer, whose keys the harness serves through Service idp. The harness adds storage profile s3 for the
# run's store (-Ps3) and hands both to the Helm chart as values.
nuna.security.issuers[0].issuer=https://idp.test/engines
nuna.security.issuers[0].jwks-uri=http://idp:8080/keys.json
nuna.security.issuers[0].audiences=nuna-catalog
nuna.security.issuers[0].algorithms=RS256
nuna.security.issuers[0].user-id-claim=sub
nuna.security.issuers[0].groups-claim=groups
nuna.security.issuers[0].client-id-claim=azp
# The maintenance worker's principal, whose compaction Job EngineMatrixTest#compaction launches (D30).
nuna.security.maintenance-principals=nuna-maintenance
# The matrix expires snapshots made a moment earlier (spark shared.maint.expire); the deployment's minimum
# snapshot age (1 h by default, D30) would refuse that commit.
nuna.governance.minimum-snapshot-age=0s
