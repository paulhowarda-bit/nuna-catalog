# The catalog server in the engine matrix's kind cluster. Shape copied from ConformanceServer. The harness
# adds the database settings and storage profile s3 for the run's store (-Ps3) and hands the whole set to
# the Helm chart (deploy/helm/keel-catalog) as its config.
keel.storage.catalogs.engines.profile=s3
keel.storage.catalogs.engines.kms-key-set=test-keys
keel.storage.catalogs.engines.legal-entity=Test Entity

keel.security.issuers[0].issuer=https://idp.test/engines
keel.security.issuers[0].jwks-uri=http://idp:8080/keys.json
keel.security.issuers[0].audiences=keel-catalog
keel.security.issuers[0].algorithms=RS256
keel.security.issuers[0].user-id-claim=sub
keel.security.issuers[0].groups-claim=groups
keel.security.issuers[0].client-id-claim=azp

keel.audit.kafka-bootstrap-servers=kafka:9092
