# The catalog settings a matrix run on its own adds to the shared stack's (demo/k8s/catalog-values.yaml): its
# test issuer, whose keys the harness serves through Service idp. The harness adds storage profile s3 for the
# run's store (-Ps3) and hands both to the Helm chart as values.
fidice.security.issuers[0].issuer=https://idp.test/engines
fidice.security.issuers[0].jwks-uri=http://idp:8080/keys.json
fidice.security.issuers[0].audiences=fidice-catalog
fidice.security.issuers[0].algorithms=RS256
fidice.security.issuers[0].user-id-claim=sub
fidice.security.issuers[0].groups-claim=groups
fidice.security.issuers[0].client-id-claim=azp
