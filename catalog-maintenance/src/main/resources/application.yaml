# The maintenance worker (D30). Everything else is set per deployment: see catalog-maintenance/README.md and the
# Helm chart deploy/helm/nuna-maintenance.
spring:
  application:
    name: nuna-maintenance
  main:
    banner-mode: off

nuna:
  maintenance:
    scan-interval: PT10M
    orphan-interval: P1D
    # cleanup-window (start, end, zone) has no default: each deployment names its own night.
    # The DR verifier (D37) is off until dr.replicas names a read-only replica for a store under storage.
    dr:
      verify-interval: PT1M

# Telemetry (docs/observability/README.md). Metrics, traces and logs go over OTLP only when an endpoint is set: the
# standard OTEL_* variables, or Boot's management.* properties. Log lines go to stdout as JSON, in Elastic Common
# Schema.
logging:
  structured:
    format:
      console: ecs
  level:
    # Iceberg logs every commit, manifest read and file IO at INFO.
    org.apache.iceberg: WARN
